<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flashcards — PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=m11" />
  <style>
    .fc-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.15rem;
      min-height: 11rem;
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    .fc-card .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .fc-card .front { font-size: 1.05rem; font-weight: 600; }
    .fc-card .back { display: none; margin-top: 0.75rem; color: var(--muted); font-size: 0.98rem; line-height: 1.45; }
    .fc-card.flipped .back { display: block; }
    .fc-card img.fc-schema {
      display: block;
      width: 100%;
      max-height: min(58vh, 420px);
      object-fit: contain;
      margin: 0.55rem 0 0;
      border-radius: var(--radius-sm);
      background: #fff;
      border: 1px solid var(--line);
    }
    .fc-card .fc-prompt { font-size: 0.92rem; font-weight: 650; margin: 0; }
    .fc-card .fc-caption { margin-top: 0.45rem; font-size: 0.9rem; color: var(--muted); }
    .prio-btns, .kind-btns, .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .prio-btn, .kind-btn, .mode-btn {
      min-width: 3.5rem;
      min-height: var(--tap-min);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.55rem 1rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .prio-btn[aria-pressed="true"],
    .kind-btn[aria-pressed="true"],
    .mode-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .prio-legend {
      margin: 0.65rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .prio-legend a { color: inherit; text-underline-offset: 2px; }
    .chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .ch-chip {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 0.35rem;
      width: auto;
      max-width: 100%;
      min-height: var(--tap-min);
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.42rem 0.72rem;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: border-color var(--ease), background var(--ease);
    }
    .ch-chip .ch-id {
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      flex: 0 0 auto;
    }
    .ch-chip .ch-name {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 550;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--pressed-bg);
      box-shadow: var(--shadow-pressed);
    }
    .ch-chip[aria-pressed="true"] .ch-name { color: var(--pressed-ink); }
    .ch-chip:disabled { opacity: 0.42; cursor: not-allowed; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin: 0 0 1.05rem;
    }
    .toolbar .btn.secondary {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.35rem 0.65rem;
      min-height: 2.25rem;
      border-radius: var(--radius-pill);
      line-height: 1.2;
    }
    .session-block {
      display: grid;
      gap: 0.85rem;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f7f4ee;
    }
    .session-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      align-items: end;
    }
    .session-controls .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .session-controls .mode-btn {
      padding: 0.45rem 0.85rem;
      font-size: 0.9rem;
    }
    .pool-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0;
    }
    .pool-stat {
      font-size: 0.78rem;
      font-weight: 650;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .pool-stat.total {
      border-color: var(--accent);
      background: var(--pressed-bg);
    }
    .pool-stat.warn { color: var(--muted); border-style: dashed; }
    .session-block .actions { margin-top: 0; }
    .session-block .actions .btn { width: 100%; }
    .session-block .actions-secondary { margin-top: 0; }
    .session-block .actions-secondary .btn {
      width: 100%;
      font-size: 0.82rem;
      padding: 0.4rem 0.85rem;
    }
    .play-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 0.75rem;
      margin: 0 0 0.65rem;
    }
    .play-top .note { margin: 0; }
    .btn-exit {
      font-size: 0.78rem;
      font-weight: 650;
      padding: 0.4rem 0.85rem;
      min-height: var(--tap-min);
      border-radius: var(--radius-pill);
    }
    .rate-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.35rem; }
    .rate-row .btn { width: 100%; }
    .end-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.15rem;
      margin: 0.75rem 0;
    }
    .end-box h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS Sorbonne</a>
      </div>
      <nav aria-label="Navigation principale">
        <ul class="nav-chips">
          <li><a href="./index.html">Accueil</a></li>
          <li><a href="./matiere.html">Matière</a></li>
          <li><a href="./entrainement.html">Entraînement</a></li>
          <li><a href="./flashcards.html" aria-current="page">Flashcards</a></li>
          <li><a href="./suivi.html">Suivi</a></li>
          <li><a href="./planning.html">Planning</a></li>
          <li><a href="./competitions.html">Compétitions</a></li>
          <li><a href="./conseils.html">Conseils</a></li>
        </ul>
      </nav>
    </header>

    <section id="setup">
      <h1 class="page-title">Flashcards</h1>

      <div class="panel">
        <h2>Chapitres</h2>
        <div class="toolbar">
          <button type="button" class="btn secondary" id="btn-ch-all">Tout</button>
          <button type="button" class="btn secondary" id="btn-ch-none">Aucun</button>
        </div>
        <div class="chapters" id="chapter-list"></div>
      </div>

      <div class="panel">
        <h2>Priorité</h2>
        <div class="prio-btns" id="priority-list" role="group" aria-label="Priorités">
          <button type="button" class="prio-btn" data-prio="P1" aria-pressed="true">P1</button>
          <button type="button" class="prio-btn" data-prio="P2" aria-pressed="true">P2</button>
          <button type="button" class="prio-btn" data-prio="P3" aria-pressed="true">P3</button>
        </div>
        <p class="prio-legend">
          <a href="./conseils.html#priorites">P1–P3</a>
        </p>
      </div>

      <div class="panel">
        <h2>Type</h2>
        <div class="kind-btns" id="kind-list" role="group" aria-label="Type de cartes">
          <button type="button" class="kind-btn" data-kind="all" aria-pressed="true">Tout</button>
          <button type="button" class="kind-btn" data-kind="text" aria-pressed="false">Texte</button>
          <button type="button" class="kind-btn" data-kind="schema" aria-pressed="false">Schémas</button>
        </div>
      </div>

      <div class="panel">
        <h2>Session</h2>
        <div class="session-block">
          <div class="session-controls">
            <div class="field">
              <span class="field-label">Pool</span>
              <div class="mode-btns" id="mode-list" role="group" aria-label="Mode">
                <button type="button" class="mode-btn" data-mode="due" aria-pressed="true">Aujourd'hui</button>
                <button type="button" class="mode-btn" data-mode="review" aria-pressed="false">À revoir</button>
                <button type="button" class="mode-btn" data-mode="all" aria-pressed="false">Tout</button>
              </div>
            </div>
            <div class="field">
              <span class="field-label">Tirage</span>
              <div class="mode-btns">
                <button type="button" class="mode-btn" id="opt-shuffle" aria-pressed="true">Mélanger</button>
              </div>
            </div>
          </div>
          <div class="pool-stats" id="pool-hint" aria-live="polite"></div>
          <div class="actions">
            <button type="button" class="btn" id="btn-start">Commencer</button>
          </div>
          <div class="actions actions-secondary">
            <button type="button" class="btn secondary" id="btn-clear-review">Reset SRS</button>
          </div>
        </div>
      </div>
    </section>

    <section id="play" class="hidden">
      <div class="play-top">
        <p class="note" id="progress">—</p>
        <button type="button" class="btn secondary btn-exit" id="btn-exit">Sortir</button>
      </div>
      <div class="fc-card" id="card" tabindex="0">
        <div class="meta" id="card-meta">Touche</div>
        <div class="front" id="card-front"></div>
        <div class="back" id="card-back"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btn-prev">Précédent</button>
        <button type="button" class="btn" id="btn-flip">Retourner</button>
        <button type="button" class="btn secondary" id="btn-next">Suivant</button>
      </div>
      <div class="rate-row">
        <button type="button" class="btn secondary" id="btn-know">Je sais</button>
        <button type="button" class="btn" id="btn-review">À revoir</button>
      </div>
    </section>

    <section id="end" class="hidden">
      <div class="end-box">
        <h2>Session terminée</h2>
        <p class="note" id="end-stats">—</p>
        <div class="actions">
          <button type="button" class="btn" id="btn-again-due">Relancer aujourd'hui</button>
          <button type="button" class="btn secondary" id="btn-again-review">Relancer à revoir</button>
          <button type="button" class="btn secondary" id="btn-end-setup">Sortir</button>
        </div>
      </div>
    </section>
  </div>

  <script src="./data/flash/ch01.js?v=5"></script>
  <script src="./data/flash/ch02.js?v=5"></script>
  <script src="./data/flash/ch03.js?v=5"></script>
  <script src="./data/flash/ch04.js?v=5"></script>
  <script src="./data/flash/ch05.js?v=5"></script>
  <script src="./data/flash/ch06.js?v=5"></script>
  <script src="./data/flash/ch07.js?v=5"></script>
  <script src="./data/flash/ch08.js?v=5"></script>
  <script src="./data/flash/ch09.js?v=5"></script>
  <script src="./data/flash/ch10.js?v=5"></script>
  <script src="./data/flash/ch11.js?v=5"></script>
  <script>
    const CHAPTER_ORDER = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"];
    const CHAPTER_META = {
      "01": "Introduction",
      "02": "Système nerveux",
      "03": "Cardio-circulatoire",
      "04": "Appareil respiratoire",
      "05": "Organes des sens",
      "06": "Rachis",
      "07": "Parois du tronc",
      "08": "Appareil digestif",
      "09": "Génito-urinaire",
      "10": "Membre supérieur",
      "11": "Membre inférieur",
    };
    const LS_KEY = "pass-flash-srs-v2";
    const LS_KEY_LEGACY = "pass-flash-review-v1";
    const SRS_INTERVALS = [0, 1, 3, 7, 14];

    const decks = window.PASS_FLASH || {};
    const elSetup = document.getElementById("setup");
    const elPlay = document.getElementById("play");
    const elEnd = document.getElementById("end");
    const elChapterList = document.getElementById("chapter-list");
    const elPriorityList = document.getElementById("priority-list");
    const elKindList = document.getElementById("kind-list");
    const elModeList = document.getElementById("mode-list");
    const elHint = document.getElementById("pool-hint");
    const elCard = document.getElementById("card");
    const elFront = document.getElementById("card-front");
    const elBack = document.getElementById("card-back");
    const elMeta = document.getElementById("card-meta");
    const elProgress = document.getElementById("progress");
    const elShuffle = document.getElementById("opt-shuffle");

    let session = [];
    let index = 0;
    let stats = { know: 0, review: 0 };

    function todayISO() {
      const d = new Date();
      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );
    }
    function addDaysISO(iso, days) {
      const d = new Date(iso + "T12:00:00");
      d.setDate(d.getDate() + days);
      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );
    }
    function loadSrs() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) return JSON.parse(raw) || {};
      } catch (_) {}
      try {
        const legacy = JSON.parse(localStorage.getItem(LS_KEY_LEGACY) || "{}") || {};
        const out = {};
        const t = todayISO();
        for (const [id, val] of Object.entries(legacy)) {
          if (val === "review") out[id] = { box: 0, due: t };
        }
        if (Object.keys(out).length) localStorage.setItem(LS_KEY, JSON.stringify(out));
        return out;
      } catch (_) {
        return {};
      }
    }
    function saveSrs(map) {
      localStorage.setItem(LS_KEY, JSON.stringify(map));
    }
    function dueIds(chs) {
      const m = loadSrs();
      const t = todayISO();
      const known = new Set();
      for (const [id, entry] of Object.entries(m)) {
        if (String((entry && entry.due) || "") <= t) known.add(id);
      }
      // cartes jamais vues = dues (bootstrap file du jour)
      const ids = new Set(known);
      for (const ch of chs || []) {
        for (const card of decks[ch] || []) {
          if (!m[card.id]) ids.add(card.id);
        }
      }
      return ids;
    }
    function reviewIds() {
      const m = loadSrs();
      return new Set(Object.keys(m).filter((id) => Number((m[id] && m[id].box) || 0) === 0));
    }
    function markCard(id, state) {
      const m = loadSrs();
      const t = todayISO();
      const prev = m[id] || { box: 0, due: t };
      let box = Number(prev.box) || 0;
      if (state === "know") {
        box = Math.min(SRS_INTERVALS.length - 1, box + 1);
        m[id] = { box: box, due: addDaysISO(t, SRS_INTERVALS[box] || 1) };
      } else {
        m[id] = { box: 0, due: t };
      }
      saveSrs(m);
    }

    function selectedChapters() {
      return [...elChapterList.querySelectorAll(".ch-chip[aria-pressed='true']")].map((b) =>
        b.getAttribute("data-ch")
      );
    }
    function selectedPriorities() {
      return [...elPriorityList.querySelectorAll(".prio-btn[aria-pressed='true']")].map((b) =>
        b.getAttribute("data-prio")
      );
    }
    function selectedKind() {
      const btn = elKindList.querySelector(".kind-btn[aria-pressed='true']");
      return (btn && btn.getAttribute("data-kind")) || "all";
    }
    function selectedMode() {
      const btn = elModeList.querySelector(".mode-btn[aria-pressed='true']");
      return (btn && btn.getAttribute("data-mode")) || "due";
    }

    function poolFrom(chs, prios, mode, kind) {
      const allowP = new Set(prios.length ? prios : ["P1", "P2", "P3"]);
      const rev = reviewIds();
      const due = mode === "due" ? dueIds(chs) : null;
      const pool = [];
      for (const ch of chs) {
        for (const card of decks[ch] || []) {
          if (!allowP.has(card.priority)) continue;
          const k = card.kind || "text";
          if (kind === "text" && k !== "text") continue;
          if (kind === "schema" && k !== "schema") continue;
          if (mode === "review" && !rev.has(card.id)) continue;
          if (mode === "due" && due && !due.has(card.id)) continue;
          pool.push(card);
        }
      }
      return pool;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function updateHint() {
      const chs = selectedChapters();
      const prios = selectedPriorities();
      const mode = selectedMode();
      const kind = selectedKind();
      const pool = poolFrom(chs, prios, mode, kind);
      const n = pool.length;
      const nRev = reviewIds().size;
      const nDue = dueIds(chs).size;
      const c1 = pool.filter((c) => c.priority === "P1").length;
      const c2 = pool.filter((c) => c.priority === "P2").length;
      const c3 = pool.filter((c) => c.priority === "P3").length;
      if (!chs.length) {
        elHint.innerHTML = '<span class="pool-stat warn">Aucun chapitre</span>';
      } else if (!prios.length) {
        elHint.innerHTML = '<span class="pool-stat warn">Aucune priorité</span>';
      } else {
        elHint.innerHTML =
          '<span class="pool-stat total">' + n + " cartes</span>" +
          '<span class="pool-stat">P1 · ' + c1 + "</span>" +
          '<span class="pool-stat">P2 · ' + c2 + "</span>" +
          '<span class="pool-stat">P3 · ' + c3 + "</span>" +
          (kind !== "all" ? '<span class="pool-stat">' + (kind === "schema" ? "Schémas" : "Texte") + "</span>" : "") +
          (mode === "due" ? '<span class="pool-stat">Aujourd\'hui</span>' : "") +
          (mode === "review" ? '<span class="pool-stat">À revoir</span>' : "") +
          (nDue ? '<span class="pool-stat">' + nDue + " dues</span>" : "") +
          (nRev ? '<span class="pool-stat">' + nRev + " box0</span>" : "");
      }
      document.getElementById("btn-start").disabled = !chs.length || !prios.length || n === 0;
    }

    function wireToggleGroup(root, sel, exclusive) {
      root.querySelectorAll(sel).forEach((btn) => {
        btn.addEventListener("click", () => {
          if (exclusive) {
            root.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", "false"));
            btn.setAttribute("aria-pressed", "true");
          } else {
            const on = btn.getAttribute("aria-pressed") !== "true";
            btn.setAttribute("aria-pressed", on ? "true" : "false");
          }
          updateHint();
        });
      });
    }

    function buildChapters() {
      elChapterList.innerHTML = "";
      const params = new URLSearchParams(location.search);
      const focusCh = (params.get("ch") || "").padStart(2, "0");
      const focusOk = !!(focusCh && CHAPTER_META[focusCh]);
      for (const ch of CHAPTER_ORDER) {
        const list = decks[ch] || [];
        const n = list.length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ch-chip";
        btn.setAttribute("data-ch", ch);
        if (!n) {
          btn.disabled = true;
          btn.setAttribute("aria-pressed", "false");
          btn.innerHTML =
            '<span class="ch-id">' + ch + '</span><span class="ch-name">' + CHAPTER_META[ch] + " · bientôt</span>";
        } else {
          btn.setAttribute("aria-pressed", focusOk ? (ch === focusCh ? "true" : "false") : "true");
          btn.innerHTML =
            '<span class="ch-id">' + ch + '</span><span class="ch-name">' + CHAPTER_META[ch] + " · " + n + "</span>";
          btn.addEventListener("click", () => {
            const pressed = btn.getAttribute("aria-pressed") === "true";
            btn.setAttribute("aria-pressed", pressed ? "false" : "true");
            updateHint();
          });
        }
        elChapterList.appendChild(btn);
      }
      wireToggleGroup(elPriorityList, ".prio-btn", false);
      wireToggleGroup(elKindList, ".kind-btn", true);
      wireToggleGroup(elModeList, ".mode-btn", true);
      if (elShuffle) {
        elShuffle.addEventListener("click", () => {
          const on = elShuffle.getAttribute("aria-pressed") !== "true";
          elShuffle.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      document.getElementById("btn-ch-all").addEventListener("click", () => {
        elChapterList.querySelectorAll(".ch-chip:not(:disabled)").forEach((b) => b.setAttribute("aria-pressed", "true"));
        updateHint();
      });
      document.getElementById("btn-ch-none").addEventListener("click", () => {
        elChapterList.querySelectorAll(".ch-chip").forEach((b) => b.setAttribute("aria-pressed", "false"));
        updateHint();
      });
      updateHint();
    }

    function show(view) {
      elSetup.classList.toggle("hidden", view !== "setup");
      elPlay.classList.toggle("hidden", view !== "play");
      elEnd.classList.toggle("hidden", view !== "end");
    }

    function fillSide(el, text, imgSrc, isBack) {
      el.innerHTML = "";
      if (imgSrc) {
        if (text) {
          const p = document.createElement("p");
          p.className = isBack ? "fc-caption" : "fc-prompt";
          p.textContent = isBack ? text : "Nomme les légendes";
          el.appendChild(p);
        }
        const img = document.createElement("img");
        img.className = "fc-schema";
        img.src = "./" + imgSrc;
        img.alt = text || (isBack ? "Schéma légendé" : "Schéma sans légende");
        el.appendChild(img);
      } else {
        el.textContent = text || "";
      }
    }

    function renderCard() {
      const card = session[index];
      if (!card) return;
      elCard.classList.remove("flipped");
      const isSchema = (card.kind || "text") === "schema";
      fillSide(elFront, card.front, isSchema ? card.frontImg : null, false);
      fillSide(elBack, card.back, isSchema ? card.backImg : null, true);
      elMeta.textContent =
        card.priority + " · ch." + card.chapter + (isSchema ? " · schéma" : "") + " · Touche";
      elProgress.textContent = index + 1 + " / " + session.length;
      document.getElementById("btn-prev").disabled = index === 0;
      document.getElementById("btn-next").disabled = index >= session.length - 1;
    }

    function flip() { elCard.classList.toggle("flipped"); }

    function finishSession() {
      const left = reviewIds().size;
      const dueLeft = dueIds(selectedChapters()).size;
      document.getElementById("end-stats").textContent =
        "Je sais : " + stats.know + " · À revoir (session) : " + stats.review +
        " · Box0 : " + left + " · Dues : " + dueLeft + ".";
      const againDue = document.getElementById("btn-again-due");
      if (againDue) againDue.disabled = dueLeft === 0;
      document.getElementById("btn-again-review").disabled = left === 0;
      show("end");
      updateHint();
    }

    function goNextOrEnd() {
      if (index < session.length - 1) {
        index += 1;
        renderCard();
      } else {
        finishSession();
      }
    }

    function startSession(modeOverride) {
      const chs = selectedChapters();
      const prios = selectedPriorities();
      const mode = modeOverride || selectedMode();
      const kind = selectedKind();
      let pool = poolFrom(chs, prios, mode, kind);
      if (elShuffle && elShuffle.getAttribute("aria-pressed") === "true") pool = shuffle(pool);
      if (mode === "due" && pool.length > 40) pool = pool.slice(0, 40);
      session = pool;
      index = 0;
      stats = { know: 0, review: 0 };
      if (!session.length) {
        updateHint();
        return;
      }
      show("play");
      renderCard();
    }

    document.getElementById("btn-start").addEventListener("click", () => startSession());
    function exitToSetup() {
      show("setup");
      updateHint();
      window.scrollTo(0, 0);
    }
    document.getElementById("btn-exit").addEventListener("click", exitToSetup);
    document.getElementById("btn-flip").addEventListener("click", flip);
    elCard.addEventListener("click", flip);
    document.getElementById("btn-next").addEventListener("click", () => {
      if (index < session.length - 1) { index += 1; renderCard(); }
      else finishSession();
    });
    document.getElementById("btn-prev").addEventListener("click", () => {
      if (index > 0) { index -= 1; renderCard(); }
    });
    document.getElementById("btn-know").addEventListener("click", () => {
      const card = session[index];
      if (!card) return;
      markCard(card.id, "know");
      stats.know += 1;
      goNextOrEnd();
    });
    document.getElementById("btn-review").addEventListener("click", () => {
      const card = session[index];
      if (!card) return;
      markCard(card.id, "review");
      stats.review += 1;
      goNextOrEnd();
    });
    document.getElementById("btn-clear-review").addEventListener("click", () => {
      if (!confirm("Effacer tout le SRS flash (échéances) ?")) return;
      saveSrs({});
      updateHint();
    });
    document.getElementById("btn-again-due").addEventListener("click", () => {
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === "due" ? "true" : "false");
      });
      startSession("due");
    });
    document.getElementById("btn-again-review").addEventListener("click", () => {
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === "review" ? "true" : "false");
      });
      startSession("review");
    });
    document.getElementById("btn-end-setup").addEventListener("click", exitToSetup);

    buildChapters();
    (function applyModeFromUrl() {
      const mode = (new URLSearchParams(location.search).get("mode") || "").toLowerCase();
      if (!mode || !elModeList) return;
      if (mode !== "due" && mode !== "review" && mode !== "all") return;
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === mode ? "true" : "false");
      });
      updateHint();
    })();
    show("setup");
  </script>
</body>
</html>
