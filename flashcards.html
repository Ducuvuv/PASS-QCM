<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flashcards &mdash; PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=da5" />
  <style>
    .fc-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.15rem;
      min-height: 11rem;
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    .fc-card .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .fc-card .front { font-size: 1.05rem; font-weight: 600; }
    .fc-card .back { display: none; margin-top: 0.75rem; color: var(--muted); font-size: 0.98rem; line-height: 1.45; }
    .fc-card.flipped .back { display: block; }
    .fc-schema-wrap {
      margin: 0.55rem 0 0;
      width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: #fff;
      line-height: 0;
      max-height: min(72vh, 560px);
    }
    .fc-card img.fc-schema {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: center top;
      margin: 0;
      border: none;
      border-radius: 0;
      background: #fff;
    }
    .fc-card .fc-schema-miss {
      margin: 0.55rem 0 0;
      padding: 0.75rem;
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .fc-card .fc-prompt { font-size: 0.92rem; font-weight: 650; margin: 0; }
    .fc-card .fc-caption { margin-top: 0.45rem; font-size: 0.9rem; color: var(--muted); }
    .prio-btns, .kind-btns, .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .prio-btn, .kind-btn, .mode-btn {
      min-width: 3.5rem;
      min-height: var(--tap-min);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.55rem 1rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .prio-btn[aria-pressed="true"],
    .kind-btn[aria-pressed="true"],
    .mode-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .prio-legend {
      margin: 0.65rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .prio-legend a { color: inherit; text-underline-offset: 2px; }
    .chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .ch-chip {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 0.35rem;
      width: auto;
      max-width: 100%;
      min-height: var(--tap-min);
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.42rem 0.72rem;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: border-color var(--ease), background var(--ease);
    }
    .ch-chip .ch-id {
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      flex: 0 0 auto;
    }
    .ch-chip .ch-name {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 550;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--pressed-bg);
      box-shadow: var(--shadow-pressed);
    }
    .ch-chip[aria-pressed="true"] .ch-name { color: var(--pressed-ink); }
    .ch-chip:disabled { opacity: 0.42; cursor: not-allowed; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin: 0 0 1.05rem;
    }
    .toolbar .btn.secondary {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.35rem 0.65rem;
      min-height: 2.25rem;
      border-radius: var(--radius-pill);
      line-height: 1.2;
    }
    .session-block {
      display: grid;
      gap: 0.85rem;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f7f4ee;
    }
    .session-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      align-items: end;
    }
    .session-controls .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .session-controls .mode-btn {
      padding: 0.45rem 0.85rem;
      font-size: 0.9rem;
    }
    .pool-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0;
    }
    .pool-stat {
      font-size: 0.78rem;
      font-weight: 650;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .pool-stat.total {
      border-color: var(--accent);
      background: var(--pressed-bg);
    }
    .pool-stat.warn { color: var(--muted); border-style: dashed; }
    .session-block .actions { margin-top: 0; }
    .session-block .actions .btn { width: 100%; }
    .session-block .actions-secondary { margin-top: 0; }
    .session-block .actions-secondary .btn {
      width: 100%;
      font-size: 0.82rem;
      padding: 0.4rem 0.85rem;
    }
    .play-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 0.75rem;
      margin: 0 0 0.65rem;
    }
    .play-top .note { margin: 0; }
    .btn-exit {
      font-size: 0.78rem;
      font-weight: 650;
      padding: 0.4rem 0.85rem;
      min-height: var(--tap-min);
      border-radius: var(--radius-pill);
    }
    .rate-wrap { margin-top: 0.55rem; }
    .rate-wrap.hidden { display: none; }
    .rate-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.45rem;
    }
    .rate-row .btn {
      width: 100%;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      min-height: 3.35rem;
      line-height: 1.15;
      padding: 0.5rem 0.35rem;
      font-size: 0.82rem;
    }
    .rate-row .btn small {
      font-size: 0.68rem;
      font-weight: 650;
      opacity: 0.8;
    }
    .rate-help {
      margin: 0 0 0.4rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .mem-help {
      margin: 0 0 0.75rem;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .end-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.15rem;
      margin: 0.75rem 0;
    }
    .end-box h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
  </style>
</head>
<body class="has-tabbar" data-tab="plus">
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS</a>
      </div>
    </header>

    <section id="setup">
      <h1 class="page-title">Flashcards</h1>
      <p class="mem-help">Tu retournes la carte, puis tu dis si tu savais. On te la rappellera plus tard si besoin.</p>

      <div class="panel">
        <h2>Chapitres</h2>
        <div class="toolbar">
          <button type="button" class="btn secondary" id="btn-ch-all">Tout</button>
          <button type="button" class="btn secondary" id="btn-ch-none">Aucun</button>
        </div>
        <div class="chapters" id="chapter-list"></div>
      </div>

      <div class="panel">
        <h2>Priorit&eacute;</h2>
        <div class="prio-btns" id="priority-list" role="group" aria-label="Priorit&eacute;s">
          <button type="button" class="prio-btn" data-prio="P1" aria-pressed="true">P1</button>
          <button type="button" class="prio-btn" data-prio="P2" aria-pressed="true">P2</button>
          <button type="button" class="prio-btn" data-prio="P3" aria-pressed="true">P3</button>
        </div>
        <p class="prio-legend">
          <a href="./conseils.html#priorites">P1&ndash;P3</a>
        </p>
      </div>

      <div class="panel">
        <h2>Type</h2>
        <div class="kind-btns" id="kind-list" role="group" aria-label="Type de cartes">
          <button type="button" class="kind-btn" data-kind="all" aria-pressed="true">Tout</button>
          <button type="button" class="kind-btn" data-kind="text" aria-pressed="false">Texte</button>
          <button type="button" class="kind-btn" data-kind="schema" aria-pressed="false">Sch&eacute;mas</button>
        </div>
      </div>

      <div class="panel">
        <h2>Quelles cartes ?</h2>
        <div class="session-block">
          <div class="session-controls">
            <div class="field">
              <span class="field-label">&Agrave; travailler</span>
              <div class="mode-btns" id="mode-list" role="group" aria-label="&Agrave; travailler">
                <button type="button" class="mode-btn" data-mode="due" aria-pressed="true">&Agrave; faire</button>
                <button type="button" class="mode-btn" data-mode="review" aria-pressed="false">Rat&eacute;es</button>
                <button type="button" class="mode-btn" data-mode="all" aria-pressed="false">Toutes</button>
              </div>
            </div>
            <div class="field">
              <span class="field-label">Ordre</span>
              <div class="mode-btns">
                <button type="button" class="mode-btn" id="opt-shuffle" aria-pressed="true">M&eacute;langer</button>
              </div>
            </div>
          </div>
          <div class="pool-stats" id="pool-hint" aria-live="polite"></div>
          <div class="actions">
            <button type="button" class="btn" id="btn-start">Commencer</button>
          </div>
          <div class="actions actions-secondary">
            <button type="button" class="btn secondary" id="btn-clear-review">Effacer ma m&eacute;moire</button>
          </div>
        </div>
      </div>
    </section>

    <section id="play" class="hidden">
      <div class="play-top">
        <p class="note" id="progress">&mdash;</p>
        <button type="button" class="btn secondary btn-exit" id="btn-exit">Sortir</button>
      </div>
      <div class="fc-card" id="card" tabindex="0">
        <div class="meta" id="card-meta">Touche pour retourner</div>
        <div class="front" id="card-front"></div>
        <div class="back" id="card-back"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="btn-flip">Voir la r&eacute;ponse</button>
      </div>
      <div class="rate-wrap hidden" id="rate-wrap">
        <p class="rate-help">Tu savais ? Prochaine fois</p>
        <div class="rate-row" role="group" aria-label="Tu savais ?">
          <button type="button" class="btn secondary" id="btn-again">Je bloque<small id="hint-again">aujourd&rsquo;hui</small></button>
          <button type="button" class="btn" id="btn-good">Je sais<small id="hint-good">demain</small></button>
          <button type="button" class="btn secondary" id="btn-easy">Trop facile<small id="hint-easy">dans 4 jours</small></button>
        </div>
      </div>
    </section>

    <section id="end" class="hidden">
      <div class="end-box">
        <h2>Session termin&eacute;e</h2>
        <p class="note" id="end-stats">&mdash;</p>
        <div class="actions">
          <button type="button" class="btn" id="btn-again-due">Continuer &agrave; faire</button>
          <button type="button" class="btn secondary" id="btn-again-review">Revoir les rat&eacute;es</button>
          <button type="button" class="btn secondary" id="btn-end-setup">Sortir</button>
        </div>
      </div>
    </section>
  </div>

  <script src="./data/flash/ch01.js?v=8"></script>
  <script src="./data/flash/ch02.js?v=8"></script>
  <script src="./data/flash/ch03.js?v=8"></script>
  <script src="./data/flash/ch04.js?v=8"></script>
  <script src="./data/flash/ch05.js?v=8"></script>
  <script src="./data/flash/ch06.js?v=8"></script>
  <script src="./data/flash/ch07.js?v=8"></script>
  <script src="./data/flash/ch08.js?v=8"></script>
  <script src="./data/flash/ch09.js?v=8"></script>
  <script src="./data/flash/ch10.js?v=8"></script>
  <script src="./data/flash/ch11.js?v=8"></script>
  <script src="./js/flash-srs.js?v=2"></script>
    <script>
    const CHAPTER_ORDER = ["01","02","03","04","05","06","07","08","09","10","11"];
    const CHAPTER_META = {
      "01":"Introduction","02":"Syst\u00e8me nerveux","03":"Cardio-circulatoire","04":"Appareil respiratoire",
      "05":"Organes des sens","06":"Rachis","07":"Parois du tronc","08":"Appareil digestif",
      "09":"G\u00e9nito-urinaire","10":"Membre sup\u00e9rieur","11":"Membre inf\u00e9rieur"
    };
    const SRS = window.PASS_FLASH_SRS;
    const decks = window.PASS_FLASH || {};
    const elSetup = document.getElementById("setup");
    const elPlay = document.getElementById("play");
    const elEnd = document.getElementById("end");
    const elChapterList = document.getElementById("chapter-list");
    const elPriorityList = document.getElementById("priority-list");
    const elKindList = document.getElementById("kind-list");
    const elModeList = document.getElementById("mode-list");
    const elHint = document.getElementById("pool-hint");
    const elCard = document.getElementById("card");
    const elFront = document.getElementById("card-front");
    const elBack = document.getElementById("card-back");
    const elMeta = document.getElementById("card-meta");
    const elProgress = document.getElementById("progress");
    const elShuffle = document.getElementById("opt-shuffle");

    let session = [];
    let index = 0;
    let stats = { again: 0, good: 0, easy: 0 };

    function cardIdsFor(chs) {
      const ids = [];
      for (const ch of chs || []) for (const c of decks[ch] || []) ids.push(c.id);
      return ids;
    }
    function dueIds(chs) { return SRS.dueIds(cardIdsFor(chs)); }
    function reviewIds(chs) { return SRS.learningIds(cardIdsFor(chs)); }

    function updateGradeHints() {
      const card = session[index];
      if (!card || !SRS) return;
      const a = SRS.preview(card.id, "again");
      const g = SRS.preview(card.id, "good");
      const e = SRS.preview(card.id, "easy");
      document.getElementById("hint-again").textContent = SRS.formatDays(a.interval);
      document.getElementById("hint-good").textContent = SRS.formatDays(g.interval);
      document.getElementById("hint-easy").textContent = SRS.formatDays(e.interval);
    }

    function selectedChapters() {
      return [...elChapterList.querySelectorAll(".ch-chip[aria-pressed='true']")].map((b) => b.getAttribute("data-ch"));
    }
    function selectedPriorities() {
      return [...elPriorityList.querySelectorAll(".prio-btn[aria-pressed='true']")].map((b) => b.getAttribute("data-prio"));
    }
    function selectedKind() {
      const b = elKindList.querySelector(".kind-btn[aria-pressed='true']");
      return (b && b.getAttribute("data-kind")) || "all";
    }
    function selectedMode() {
      const b = elModeList.querySelector(".mode-btn[aria-pressed='true']");
      return (b && b.getAttribute("data-mode")) || "due";
    }

    function poolFrom(chs, prios, mode, kind) {
      const allowP = new Set(prios.length ? prios : ["P1","P2","P3"]);
      const rev = reviewIds(chs);
      const due = mode === "due" ? dueIds(chs) : null;
      const pool = [];
      for (const ch of chs) {
        for (const card of decks[ch] || []) {
          if (!allowP.has(card.priority)) continue;
      const k = card.frontImg ? "schema" : (card.kind || "text");
          if (kind === "text" && k !== "text") continue;
          if (kind === "schema" && k !== "schema") continue;
          if (mode === "review" && !rev.has(card.id)) continue;
          if (mode === "due" && due && !due.has(card.id)) continue;
          pool.push(card);
        }
      }
      return pool;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function updateHint() {
      const chs = selectedChapters();
      const prios = selectedPriorities();
      const mode = selectedMode();
      const kind = selectedKind();
      const pool = poolFrom(chs, prios, mode, kind);
      const n = pool.length;
      const nRev = reviewIds(chs).size;
      const nDue = dueIds(chs).size;
      const c1 = pool.filter((c) => c.priority === "P1").length;
      const c2 = pool.filter((c) => c.priority === "P2").length;
      const c3 = pool.filter((c) => c.priority === "P3").length;
      if (!chs.length) elHint.innerHTML = '<span class="pool-stat warn">Choisis un chapitre</span>';
      else if (!prios.length) elHint.innerHTML = '<span class="pool-stat warn">Choisis une priorit&eacute;</span>';
      else {
        elHint.innerHTML =
          '<span class="pool-stat total">' + n + " cartes</span>" +
          '<span class="pool-stat">P1 &middot; ' + c1 + "</span>" +
          '<span class="pool-stat">P2 &middot; ' + c2 + "</span>" +
          '<span class="pool-stat">P3 &middot; ' + c3 + "</span>" +
          (kind !== "all" ? '<span class="pool-stat">' + (kind === "schema" ? "Sch&eacute;mas" : "Texte") + "</span>" : "") +
          (nDue ? '<span class="pool-stat">' + nDue + " &agrave; faire</span>" : "") +
          (nRev ? '<span class="pool-stat">' + nRev + " rat&eacute;es</span>" : "");
      }
      document.getElementById("btn-start").disabled = !chs.length || !prios.length || n === 0;
    }

    function wireToggleGroup(root, sel, exclusive) {
      root.querySelectorAll(sel).forEach((btn) => {
        btn.addEventListener("click", () => {
          if (exclusive) {
            root.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", "false"));
            btn.setAttribute("aria-pressed", "true");
          } else {
            const on = btn.getAttribute("aria-pressed") !== "true";
            btn.setAttribute("aria-pressed", on ? "true" : "false");
          }
          updateHint();
        });
      });
    }

    function buildChapters() {
      elChapterList.innerHTML = "";
      const focusCh = (new URLSearchParams(location.search).get("ch") || "").padStart(2, "0");
      const focusOk = !!(focusCh && CHAPTER_META[focusCh]);
      for (const ch of CHAPTER_ORDER) {
        const list = decks[ch] || [];
        const n = list.length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ch-chip";
        btn.setAttribute("data-ch", ch);
        if (!n) {
          btn.disabled = true;
          btn.setAttribute("aria-pressed", "false");
          btn.innerHTML = '<span class="ch-id">' + ch + '</span><span class="ch-name">' + CHAPTER_META[ch] + " &middot; bient&ocirc;t</span>";
        } else {
          btn.setAttribute("aria-pressed", focusOk ? (ch === focusCh ? "true" : "false") : "true");
          btn.innerHTML = '<span class="ch-id">' + ch + '</span><span class="ch-name">' + CHAPTER_META[ch] + " &middot; " + n + "</span>";
          btn.addEventListener("click", () => {
            const on = btn.getAttribute("aria-pressed") !== "true";
            btn.setAttribute("aria-pressed", on ? "true" : "false");
            updateHint();
          });
        }
        elChapterList.appendChild(btn);
      }
      wireToggleGroup(elPriorityList, ".prio-btn", false);
      wireToggleGroup(elKindList, ".kind-btn", true);
      wireToggleGroup(elModeList, ".mode-btn", true);
      if (elShuffle) {
        elShuffle.addEventListener("click", () => {
          const on = elShuffle.getAttribute("aria-pressed") !== "true";
          elShuffle.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      document.getElementById("btn-ch-all").addEventListener("click", () => {
        elChapterList.querySelectorAll(".ch-chip:not(:disabled)").forEach((b) => b.setAttribute("aria-pressed", "true"));
        updateHint();
      });
      document.getElementById("btn-ch-none").addEventListener("click", () => {
        elChapterList.querySelectorAll(".ch-chip").forEach((b) => b.setAttribute("aria-pressed", "false"));
        updateHint();
      });
      updateHint();
    }

    function show(view) {
      elSetup.classList.toggle("hidden", view !== "setup");
      elPlay.classList.toggle("hidden", view !== "play");
      elEnd.classList.toggle("hidden", view !== "end");
    }

    function schemaFrontPrompt(front) {
      if (!front) return "Sch\u00e9ma : nommer les l\u00e9gendes ?";
      if (/[?:]/.test(front)) return front;
      if (front.indexOf("Sch\u00e9ma") === 0) return front + " : nommer les l\u00e9gendes ?";
      return front;
    }

    function fillSide(el, text, imgSrc, isBack) {
      el.innerHTML = "";
      if (imgSrc) {
        if (text || !isBack) {
          const p = document.createElement("p");
          p.className = isBack ? "fc-caption" : "fc-prompt";
          p.textContent = isBack ? (text || "Sch\u00e9ma l\u00e9gend\u00e9") : schemaFrontPrompt(text);
          el.appendChild(p);
        }
        const wrap = document.createElement("div");
        wrap.className = "fc-schema-wrap";
        const img = document.createElement("img");
        img.className = "fc-schema";
        img.loading = "eager";
        img.decoding = "async";
        img.alt = text || (isBack ? "Sch\u00e9ma l\u00e9gend\u00e9" : "Sch\u00e9ma sans l\u00e9gende");
        img.onerror = function () {
          const miss = document.createElement("p");
          miss.className = "fc-schema-miss";
          miss.textContent = "Sch\u00e9ma introuvable \u2014 hard refresh (ou r\u00e9seau).";
          wrap.replaceWith(miss);
        };
        img.src = "./" + imgSrc.replace(/^\.\//, "");
        wrap.appendChild(img);
        el.appendChild(wrap);
      } else el.textContent = text || "";
    }

    const elRateWrap = document.getElementById("rate-wrap");
    const elFlip = document.getElementById("btn-flip");

    function setFlipped(on) {
      elCard.classList.toggle("flipped", !!on);
      elRateWrap.classList.toggle("hidden", !on);
      elFlip.textContent = on ? "Cacher la r\u00e9ponse" : "Voir la r\u00e9ponse";
      elMeta.textContent = on
        ? "Dis si tu savais"
        : (elMeta.dataset.base || "Touche pour retourner");
    }

    function renderCard() {
      const card = session[index];
      if (!card) return;
      const isSchema = !!card.frontImg || (card.kind || "text") === "schema";
      fillSide(elFront, card.front, isSchema ? card.frontImg : null, false);
      fillSide(elBack, card.back, isSchema ? card.backImg : null, true);
      elMeta.dataset.base = card.priority + " \u00b7 ch." + card.chapter + (isSchema ? " \u00b7 sch\u00e9ma" : "") + " \u00b7 Touche pour retourner";
      elProgress.textContent = index + 1 + " / " + session.length;
      setFlipped(false);
      updateGradeHints();
    }

    function flip() { setFlipped(!elCard.classList.contains("flipped")); }

    function finishSession() {
      const chs = selectedChapters();
      const left = reviewIds(chs).size;
      const dueLeft = dueIds(chs).size;
      const parts = [];
      if (stats.again) parts.push("bloqu\u00e9 " + stats.again);
      if (stats.good) parts.push("su " + stats.good);
      if (stats.easy) parts.push("trop facile " + stats.easy);
      let msg = parts.length ? "Tu as " + parts.join(" \u00b7 ") + "." : "Session vide.";
      if (dueLeft) msg += " Encore " + dueLeft + " \u00e0 faire.";
      else if (left) msg += " " + left + " rat\u00e9es \u00e0 revoir.";
      else msg += " Rien d\u2019autre pour l\u2019instant.";
      document.getElementById("end-stats").textContent = msg;
      document.getElementById("btn-again-due").disabled = dueLeft === 0;
      document.getElementById("btn-again-review").disabled = left === 0;
      show("end");
      updateHint();
    }

    function goNextOrEnd() {
      if (index < session.length - 1) { index += 1; renderCard(); }
      else finishSession();
    }

    function gradeCurrent(grade) {
      const card = session[index];
      if (!card) return;
      SRS.grade(card.id, grade);
      stats[grade] += 1;
      goNextOrEnd();
    }

    function startSession(modeOverride) {
      const chs = selectedChapters();
      const prios = selectedPriorities();
      const mode = modeOverride || selectedMode();
      const kind = selectedKind();
      let pool = poolFrom(chs, prios, mode, kind);
      if (elShuffle && elShuffle.getAttribute("aria-pressed") === "true") pool = shuffle(pool);
      if (mode === "due" && pool.length > SRS.SESSION_CAP) pool = pool.slice(0, SRS.SESSION_CAP);
      session = pool;
      index = 0;
      stats = { again: 0, good: 0, easy: 0 };
      if (!session.length) { updateHint(); return; }
      show("play");
      renderCard();
    }

    document.getElementById("btn-start").addEventListener("click", () => startSession());
    function exitToSetup() { show("setup"); updateHint(); window.scrollTo(0, 0); }
    document.getElementById("btn-exit").addEventListener("click", exitToSetup);
    elFlip.addEventListener("click", flip);
    elCard.addEventListener("click", flip);
    document.getElementById("btn-again").addEventListener("click", () => gradeCurrent("again"));
    document.getElementById("btn-good").addEventListener("click", () => gradeCurrent("good"));
    document.getElementById("btn-easy").addEventListener("click", () => gradeCurrent("easy"));
    document.getElementById("btn-clear-review").addEventListener("click", () => {
      if (!confirm("Effacer quand chaque carte revient ? Tu repars de z\u00e9ro.")) return;
      SRS.clear();
      updateHint();
    });
    document.getElementById("btn-again-due").addEventListener("click", () => {
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === "due" ? "true" : "false");
      });
      startSession("due");
    });
    document.getElementById("btn-again-review").addEventListener("click", () => {
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === "review" ? "true" : "false");
      });
      startSession("review");
    });
    document.getElementById("btn-end-setup").addEventListener("click", exitToSetup);

    buildChapters();
    (function applyModeFromUrl() {
      const mode = (new URLSearchParams(location.search).get("mode") || "").toLowerCase();
      if (mode !== "due" && mode !== "review" && mode !== "all") return;
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === mode ? "true" : "false");
      });
      updateHint();
    })();
    show("setup");
  </script><nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
