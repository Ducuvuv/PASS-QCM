<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flashcards — PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=m6" />
  <style>
    .fc-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.15rem;
      min-height: 11rem;
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    .fc-card .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .fc-card .front { font-size: 1.05rem; font-weight: 600; }
    .fc-card .back { display: none; margin-top: 0.75rem; color: var(--muted); font-size: 0.98rem; line-height: 1.45; }
    .fc-card.flipped .back { display: block; }
    .fc-card img.fc-schema {
      display: block;
      width: 100%;
      max-height: min(58vh, 420px);
      object-fit: contain;
      margin: 0.55rem 0 0;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .fc-card .fc-prompt { font-size: 0.92rem; font-weight: 650; margin: 0; }
    .fc-card .fc-caption { margin-top: 0.45rem; font-size: 0.9rem; color: var(--muted); }
    .prio-btns, .kind-btns, .mode-btns { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.35rem; }
    .prio-btn, .kind-btn, .mode-btn {
      min-width: 3.5rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.5rem 0.95rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .prio-btn[aria-pressed="true"],
    .kind-btn[aria-pressed="true"],
    .mode-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .prio-help { list-style: none; margin: 0.75rem 0 0; padding: 0; font-size: 0.88rem; color: var(--muted); }
    .prio-help li { margin-bottom: 0.3rem; }
    .prio-help strong { color: var(--ink); }
    .chapters { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    @media (max-width: 520px) { .chapters { grid-template-columns: 1fr; } }
    .ch-chip {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.12rem;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      font: inherit;
      cursor: pointer;
    }
    .ch-chip .ch-id { font-weight: 800; font-size: 0.95rem; }
    .ch-chip .ch-name { font-size: 0.8rem; color: var(--muted); font-weight: 550; line-height: 1.25; }
    .ch-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: #e3efe8;
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .ch-chip[aria-pressed="true"] .ch-name { color: #1f4d3a; }
    .ch-chip:disabled { opacity: 0.42; cursor: not-allowed; }
    .ch-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.65rem; }
    .ch-toolbar .btn { padding: 0.4rem 0.85rem; font-size: 0.88rem; }
    .rate-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.35rem; }
    .rate-row .btn { width: 100%; }
    .end-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.15rem;
      margin: 0.75rem 0;
    }
    .end-box h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
    .check-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.65rem; font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS Sorbonne</a>
      </div>
      <nav aria-label="Navigation principale">
        <ul class="nav-chips">
          <li><a href="./index.html">Accueil</a></li>
          <li><a href="./matiere.html">Matière</a></li>
          <li><a href="./entrainement.html">Entraînement</a></li>
          <li><a href="./flashcards.html" aria-current="page">Flashcards</a></li>
          <li><a href="./suivi.html">Suivi</a></li>
          <li><a href="./planning.html">Planning</a></li>
          <li><a href="./competitions.html">Compétitions</a></li>
          <li><a href="./conseils.html">Conseils</a></li>
        </ul>
      </nav>
    </header>

    <section id="setup">
      <h1 class="page-title">Flashcards</h1>

      <div class="panel">
        <h2>Chapitre</h2>
        <div class="ch-toolbar">
          <button type="button" class="btn secondary" id="btn-ch-all">Tout</button>
          <button type="button" class="btn secondary" id="btn-ch-none">Aucun</button>
        </div>
        <div class="chapters" id="chapter-list"></div>
      </div>

      <div class="panel">
        <h2>Priorité</h2>
        <div class="prio-btns" id="priority-list" role="group" aria-label="Priorités">
          <button type="button" class="prio-btn" data-prio="P1" aria-pressed="true">P1</button>
          <button type="button" class="prio-btn" data-prio="P2" aria-pressed="true">P2</button>
          <button type="button" class="prio-btn" data-prio="P3" aria-pressed="true">P3</button>
        </div>
      </div>

      <div class="panel">
        <h2>Type</h2>
        <div class="kind-btns" id="kind-list" role="group" aria-label="Type de cartes">
          <button type="button" class="kind-btn" data-kind="all" aria-pressed="true">Tout</button>
          <button type="button" class="kind-btn" data-kind="text" aria-pressed="false">Texte</button>
          <button type="button" class="kind-btn" data-kind="schema" aria-pressed="false">Schémas</button>
        </div>
      </div>

      <div class="panel">
        <h2>Session</h2>
        <div class="mode-btns" id="mode-list" role="group" aria-label="Mode">
          <button type="button" class="mode-btn" data-mode="all" aria-pressed="true">Tout le pool</button>
          <button type="button" class="mode-btn" data-mode="review" aria-pressed="false">À revoir seulement</button>
        </div>
        <button type="button" class="mode-btn" id="opt-shuffle" aria-pressed="true" style="margin-top:0.65rem">Mélanger les cartes</button>
        <p class="note" style="margin-top:0.75rem" id="pool-hint">—</p>
        <p class="note" id="review-hint">—</p>
        <div class="actions">
          <button type="button" class="btn" id="btn-start">Commencer</button>
          <button type="button" class="btn secondary" id="btn-clear-review">Reset « À revoir »</button>
        </div>
      </div>
    </section>

    <section id="play" class="hidden">
      <p class="note" style="margin-top:0"><a href="#" id="btn-back">← Réglages</a></p>
      <p class="note" id="progress">—</p>
      <div class="fc-card" id="card" tabindex="0">
        <div class="meta" id="card-meta">Touche pour retourner</div>
        <div class="front" id="card-front"></div>
        <div class="back" id="card-back"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btn-prev">Précédent</button>
        <button type="button" class="btn" id="btn-flip">Retourner</button>
        <button type="button" class="btn secondary" id="btn-next">Suivant</button>
      </div>
      <div class="rate-row">
        <button type="button" class="btn secondary" id="btn-know">Je sais</button>
        <button type="button" class="btn" id="btn-review">À revoir</button>
      </div>
    </section>

    <section id="end" class="hidden">
      <div class="end-box">
        <h2>Session terminée</h2>
        <p class="note" id="end-stats">—</p>
        <div class="actions">
          <button type="button" class="btn" id="btn-again-review">Relancer les « À revoir »</button>
          <button type="button" class="btn secondary" id="btn-end-setup">Retour réglages</button>
        </div>
      </div>
    </section>
  </div>

  <script src="./data/flash/ch01.js?v=5"></script>
  <script src="./data/flash/ch02.js?v=5"></script>
  <script src="./data/flash/ch03.js?v=5"></script>
  <script src="./data/flash/ch04.js?v=5"></script>
  <script src="./data/flash/ch05.js?v=5"></script>
  <script src="./data/flash/ch06.js?v=5"></script>
  <script src="./data/flash/ch07.js?v=5"></script>
  <script src="./data/flash/ch08.js?v=5"></script>
  <script src="./data/flash/ch09.js?v=5"></script>
  <script src="./data/flash/ch10.js?v=5"></script>
  <script src="./data/flash/ch11.js?v=5"></script>
  <script>
    const CHAPTER_ORDER = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"];
    const CHAPTER_META = {
      "01": "Introduction",
      "02": "Système nerveux",
      "03": "Cardio-circulatoire",
      "04": "Appareil respiratoire",
      "05": "Organes des sens",
      "06": "Rachis",
      "07": "Parois du tronc",
      "08": "Appareil digestif",
      "09": "Génito-urinaire",
      "10": "Membre supérieur",
      "11": "Membre inférieur",
    };
    const LS_KEY = "pass-flash-review-v1";

    const decks = window.PASS_FLASH || {};
    const elSetup = document.getElementById("setup");
    const elPlay = document.getElementById("play");
    const elEnd = document.getElementById("end");
    const elChapterList = document.getElementById("chapter-list");
    const elPriorityList = document.getElementById("priority-list");
    const elKindList = document.getElementById("kind-list");
    const elModeList = document.getElementById("mode-list");
    const elHint = document.getElementById("pool-hint");
    const elReviewHint = document.getElementById("review-hint");
    const elCard = document.getElementById("card");
    const elFront = document.getElementById("card-front");
    const elBack = document.getElementById("card-back");
    const elMeta = document.getElementById("card-meta");
    const elProgress = document.getElementById("progress");
    const elShuffle = document.getElementById("opt-shuffle");

    let session = [];
    let index = 0;
    let stats = { know: 0, review: 0 };

    function loadReview() {
      try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; }
      catch { return {}; }
    }
    function saveReview(map) {
      localStorage.setItem(LS_KEY, JSON.stringify(map));
    }
    function reviewIds() {
      const m = loadReview();
      return new Set(Object.keys(m).filter((id) => m[id] === "review"));
    }
    function markCard(id, state) {
      const m = loadReview();
      if (state === "know") delete m[id];
      else m[id] = "review";
      saveReview(m);
    }

    function selectedChapters() {
      return [...elChapterList.querySelectorAll(".ch-chip[aria-pressed='true']")].map((b) =>
        b.getAttribute("data-ch")
      );
    }
    function selectedPriorities() {
      return [...elPriorityList.querySelectorAll(".prio-btn[aria-pressed='true']")].map((b) =>
        b.getAttribute("data-prio")
      );
    }
    function selectedKind() {
      const btn = elKindList.querySelector(".kind-btn[aria-pressed='true']");
      return (btn && btn.getAttribute("data-kind")) || "all";
    }
    function selectedMode() {
      const btn = elModeList.querySelector(".mode-btn[aria-pressed='true']");
      return (btn && btn.getAttribute("data-mode")) || "all";
    }

    function poolFrom(chs, prios, mode, kind) {
      const allowP = new Set(prios.length ? prios : ["P1", "P2", "P3"]);
      const needReview = mode === "review";
      const rev = reviewIds();
      const pool = [];
      for (const ch of chs) {
        for (const card of decks[ch] || []) {
          if (!allowP.has(card.priority)) continue;
          const k = card.kind || "text";
          if (kind === "text" && k !== "text") continue;
          if (kind === "schema" && k !== "schema") continue;
          if (needReview && !rev.has(card.id)) continue;
          pool.push(card);
        }
      }
      return pool;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function updateHint() {
      const chs = selectedChapters();
      const prios = selectedPriorities();
      const mode = selectedMode();
      const kind = selectedKind();
      const n = poolFrom(chs, prios, mode, kind).length;
      const nRev = reviewIds().size;
      const kindLabel = kind === "all" ? "" : " · " + kind;
      if (!chs.length) elHint.textContent = "Choisis au moins un chapitre.";
      else if (!prios.length) elHint.textContent = "Active au moins une priorité.";
      else elHint.textContent = n + " carte" + (n > 1 ? "s" : "") + " · " + prios.join("+") + kindLabel + (mode === "review" ? " · à revoir" : "") + ".";
      elReviewHint.textContent = nRev ? nRev + " carte(s) marquées « À revoir » (local)." : "Aucune carte « À revoir » pour l’instant.";
      document.getElementById("btn-start").disabled = !chs.length || !prios.length || n === 0;
    }

    function wireToggleGroup(root, sel, exclusive) {
      root.querySelectorAll(sel).forEach((btn) => {
        btn.addEventListener("click", () => {
          if (exclusive) {
            root.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", "false"));
            btn.setAttribute("aria-pressed", "true");
          } else {
            const on = btn.getAttribute("aria-pressed") !== "true";
            btn.setAttribute("aria-pressed", on ? "true" : "false");
          }
          updateHint();
        });
      });
    }

    function buildChapters() {
      elChapterList.innerHTML = "";
      const params = new URLSearchParams(location.search);
      const focusCh = (params.get("ch") || "").padStart(2, "0");
      const focusOk = focusCh && CHAPTER_META[focusCh];
      for (const ch of CHAPTER_ORDER) {
        const list = decks[ch] || [];
        const n = list.length;
        const nSchema = list.filter((c) => c.kind === "schema").length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ch-chip";
        btn.setAttribute("data-ch", ch);
        if (!n) {
          btn.disabled = true;
          btn.setAttribute("aria-pressed", "false");
          btn.innerHTML =
            '<span class="ch-id">' + ch + '</span><span class="ch-name">' + CHAPTER_META[ch] + " · bientôt</span>";
        } else {
          const on = focusOk ? ch === focusCh : true;
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          const extra = nSchema ? " · " + nSchema + " sch." : "";
          btn.innerHTML =
            '<span class="ch-id">' + ch + '</span><span class="ch-name">' + CHAPTER_META[ch] + " · " + n + extra + "</span>";
          btn.addEventListener("click", () => {
            const pressed = btn.getAttribute("aria-pressed") === "true";
            btn.setAttribute("aria-pressed", pressed ? "false" : "true");
            updateHint();
          });
        }
        elChapterList.appendChild(btn);
      }
      wireToggleGroup(elPriorityList, ".prio-btn", false);
      wireToggleGroup(elKindList, ".kind-btn", true);
      wireToggleGroup(elModeList, ".mode-btn", true);
      if (elShuffle) {
        elShuffle.addEventListener("click", () => {
          const on = elShuffle.getAttribute("aria-pressed") !== "true";
          elShuffle.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      const btnAll = document.getElementById("btn-ch-all");
      const btnNone = document.getElementById("btn-ch-none");
      if (btnAll) {
        btnAll.addEventListener("click", () => {
          elChapterList.querySelectorAll(".ch-chip:not(:disabled)").forEach((b) => b.setAttribute("aria-pressed", "true"));
          updateHint();
        });
      }
      if (btnNone) {
        btnNone.addEventListener("click", () => {
          elChapterList.querySelectorAll(".ch-chip").forEach((b) => b.setAttribute("aria-pressed", "false"));
          updateHint();
        });
      }
      updateHint();
    }

    function show(view) {
      elSetup.classList.toggle("hidden", view !== "setup");
      elPlay.classList.toggle("hidden", view !== "play");
      elEnd.classList.toggle("hidden", view !== "end");
    }

    function fillSide(el, text, imgSrc, isBack) {
      el.innerHTML = "";
      if (imgSrc) {
        if (text) {
          const p = document.createElement("p");
          p.className = isBack ? "fc-caption" : "fc-prompt";
          p.textContent = isBack ? text : "Nomme les légendes";
          el.appendChild(p);
        }
        const img = document.createElement("img");
        img.className = "fc-schema";
        img.src = "./" + imgSrc;
        img.alt = text || (isBack ? "Schéma légendé" : "Schéma sans légende");
        el.appendChild(img);
      } else {
        el.textContent = text || "";
      }
    }

    function renderCard() {
      const card = session[index];
      if (!card) return;
      elCard.classList.remove("flipped");
      const isSchema = (card.kind || "text") === "schema";
      fillSide(elFront, card.front, isSchema ? card.frontImg : null, false);
      fillSide(elBack, card.back, isSchema ? card.backImg : null, true);
      elMeta.textContent =
        card.priority + " · ch." + card.chapter + (isSchema ? " · schéma" : "") + " · touche pour retourner";
      elProgress.textContent = index + 1 + " / " + session.length;
      document.getElementById("btn-prev").disabled = index === 0;
      document.getElementById("btn-next").disabled = index >= session.length - 1;
    }

    function flip() { elCard.classList.toggle("flipped"); }

    function finishSession() {
      const left = reviewIds().size;
      document.getElementById("end-stats").textContent =
        "Je sais : " + stats.know + " · À revoir (cette session) : " + stats.review +
        " · Encore marquées « À revoir » : " + left + ".";
      document.getElementById("btn-again-review").disabled = left === 0;
      show("end");
      updateHint();
    }

    function goNextOrEnd() {
      if (index < session.length - 1) {
        index += 1;
        renderCard();
      } else {
        finishSession();
      }
    }

    function startSession(modeOverride) {
      const chs = selectedChapters();
      const prios = selectedPriorities();
      const mode = modeOverride || selectedMode();
      const kind = selectedKind();
      let pool = poolFrom(chs, prios, mode, kind);
      if (elShuffle && elShuffle.getAttribute("aria-pressed") === "true") pool = shuffle(pool);
      session = pool;
      index = 0;
      stats = { know: 0, review: 0 };
      if (!session.length) {
        updateHint();
        return;
      }
      show("play");
      renderCard();
    }

    document.getElementById("btn-start").addEventListener("click", () => startSession());
    document.getElementById("btn-back").addEventListener("click", (e) => {
      e.preventDefault();
      show("setup");
      updateHint();
    });
    document.getElementById("btn-flip").addEventListener("click", flip);
    elCard.addEventListener("click", flip);
    document.getElementById("btn-next").addEventListener("click", () => {
      if (index < session.length - 1) { index += 1; renderCard(); }
      else finishSession();
    });
    document.getElementById("btn-prev").addEventListener("click", () => {
      if (index > 0) { index -= 1; renderCard(); }
    });
    document.getElementById("btn-know").addEventListener("click", () => {
      const card = session[index];
      if (!card) return;
      markCard(card.id, "know");
      stats.know += 1;
      goNextOrEnd();
    });
    document.getElementById("btn-review").addEventListener("click", () => {
      const card = session[index];
      if (!card) return;
      markCard(card.id, "review");
      stats.review += 1;
      goNextOrEnd();
    });
    document.getElementById("btn-clear-review").addEventListener("click", () => {
      if (!confirm("Effacer toutes les cartes « À revoir » ?")) return;
      saveReview({});
      updateHint();
    });
    document.getElementById("btn-again-review").addEventListener("click", () => {
      elModeList.querySelectorAll(".mode-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-mode") === "review" ? "true" : "false");
      });
      startSession("review");
    });
    document.getElementById("btn-end-setup").addEventListener("click", () => {
      show("setup");
      updateHint();
    });

    buildChapters();
    show("setup");
  </script>
</body>
</html>
