<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QCM — PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=da6" />
  <style>
    :root {
      --bg: #f1eee7;
      --bg-accent: #dfe8e1;
      --bg-spot: var(--bg-accent);
      --surface: #fffcf7;
      --card: var(--surface);
      --ink: #14241c;
      --deep: #0f2a1f;
      --muted: #5c6b62;
      --line: #d5cdc0;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --bad: #991b1b;
      --bad-bg: #fee2e2;
      --accent: #1a5c44;
      --accent-soft: #e4f0ea;
      --pressed-bg: var(--accent-soft);
      --pressed-ink: #1f4d3a;
      --shadow: 0 1px 0 rgba(22, 53, 40, 0.04);
      --shadow-pressed: inset 0 0 0 1px var(--accent);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius: 16px;
      --radius-pill: 999px;
      --ease: 0.12s ease;
      --tap-min: 44px;
      --font: "Manrope", system-ui, sans-serif;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Literata", Georgia, serif;
      --max: 40rem;
    }
    * { box-sizing: border-box; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.25rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .ch-chip {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 0.35rem;
      width: auto;
      max-width: 100%;
      min-height: var(--tap-min);
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.42rem 0.72rem;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }
    .ch-chip .ch-id {
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      flex: 0 0 auto;
    }
    .ch-chip .ch-name {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 550;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--pressed-bg);
      box-shadow: var(--shadow-pressed);
    }
    .ch-chip[aria-pressed="true"] .ch-name { color: var(--pressed-ink); }
    .ch-chip:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }
    .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .mode-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.55rem 1rem;
      min-height: var(--tap-min);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: end;
    }
    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    input[type="number"], select {
      font: inherit;
      padding: 0.4rem 0.55rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: #fff;
      min-width: 5.5rem;
    }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin: 0 0 1.05rem;
    }
    .toolbar .btn.secondary {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.35rem 0.65rem;
      min-height: 2.25rem;
      border-radius: var(--radius-pill);
      line-height: 1.2;
    }
    header.quiz-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .stem { font-size: 1.05rem; margin: 0 0 1rem; }
    .q-img-wrap { margin: 0 0 1rem; text-align: center; }
    .q-img-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: #fff;
    }
    .choice {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      padding: 0.75rem 0.8rem;
      min-height: var(--tap-min);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      margin-bottom: 0.5rem;
      cursor: pointer;
      background: var(--card);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--pressed-bg); }
    .choice.reveal-ok { border-color: #86efac; background: var(--ok-bg); }
    .choice.reveal-bad { border-color: #fca5a5; background: var(--bad-bg); }
    .choice input { margin-top: 0.2rem; }
    .why { display: none; margin: 0.35rem 0 0 1.5rem; font-size: 0.9rem; color: var(--muted); }
    .revealed .why { display: block; }
    .mark { font-weight: 700; font-size: 0.85rem; }
    .mark.ok { color: var(--ok); }
    .mark.bad { color: var(--bad); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .score-box {
      margin-top: 0.85rem;
      padding: 0.7rem 0.8rem;
      border-radius: var(--radius-md);
      background: #ebe6dc;
      display: none;
    }
    .score-box.show { display: block; }
    .tags { margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); }
    .hidden { display: none !important; }
    .big-score {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0.25rem 0 0.5rem;
    }
    .feedback-block {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .feedback-block h3 {
      font-size: 1rem;
      margin: 0 0 0.5rem;
    }
    .feedback-block ul {
      margin: 0;
      padding-left: 1.15rem;
    }
    .feedback-block li { margin-bottom: 0.4rem; }
    .weak-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }
    .chip {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 650;
      padding: 0.35rem 0.65rem;
      min-height: 2.5rem;
      border-radius: var(--radius-pill);
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .chip.ch {
      background: #e8f0ea;
      border-color: var(--accent);
    }
    .recap {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .next-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.85rem;
    }
    .next-links:empty { display: none; }
    .next-links a {
      display: inline-block;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      text-decoration: none;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 650;
    }
    .next-links a.primary-next {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      flex-basis: 100%;
      font-size: 0.98rem;
      font-weight: 800;
      text-align: center;
    }
    .actions .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .prio-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .prio-btn {
      min-width: 3.5rem;
      min-height: var(--tap-min);
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius-pill);
      padding: 0.55rem 1rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .prio-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .prio-legend {
      margin: 0.65rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .prio-legend a { text-underline-offset: 2px; }
    .session-block {
      display: grid;
      gap: 0.85rem;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f7f4ee;
    }
    .session-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      align-items: end;
    }
    .session-controls .field label,
    .session-controls .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .session-controls input[type="number"] {
      width: 4.5rem;
      min-width: 0;
      padding: 0.45rem 0.55rem;
      border-radius: var(--radius-pill);
      text-align: center;
      font-weight: 700;
    }
    .session-controls .mode-btn {
      padding: 0.45rem 0.85rem;
      font-size: 0.9rem;
    }
    .pool-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0;
    }
    .pool-stat {
      font-size: 0.78rem;
      font-weight: 650;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .pool-stat.total {
      border-color: var(--accent);
      background: var(--pressed-bg);
    }
    .pool-stat.warn { color: var(--muted); border-style: dashed; }
    .session-block .actions { margin-top: 0; }
    .session-block .actions .btn { width: 100%; }
  </style>
</head>
<body class="has-tabbar" data-tab="qcm">
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS</a>
        <span class="site-pill">Anatomie</span>
      </div>
    </header>

    <!-- SETUP -->
    <section id="setup">
      <h1 class="page-title">QCM</h1>
    <p class="notice-warn" role="note">
      <strong>Annales</strong> &mdash; QCM directement inspir&eacute;s des annales PASS Sorbonne (reformulation p&eacute;dagogique, pas copie mot &agrave; mot).
    </p>

      <div class="panel">
        <h2>Chapitres</h2>
        <div class="toolbar">
          <button type="button" class="btn secondary" id="btn-all">Tout</button>
          <button type="button" class="btn secondary" id="btn-none">Aucun</button>
        </div>
        <div class="chapters" id="chapter-list"></div>
      </div>

      <div class="panel">
        <h2>Priorité</h2>
        <div class="prio-btns" id="priority-list" role="group" aria-label="Priorités">
          <button type="button" class="prio-btn" data-prio="P1" aria-pressed="true">P1</button>
          <button type="button" class="prio-btn" data-prio="P2" aria-pressed="true">P2</button>
          <button type="button" class="prio-btn" data-prio="P3" aria-pressed="true">P3</button>
        </div>
        <p class="prio-legend" style="margin:0.65rem 0 0">
          <a href="./conseils.html#priorites" style="color:inherit">P1–P3</a>
        </p>
      </div>

      <div class="panel">
        <h2>Session</h2>
        <div class="session-block">
          <div class="session-controls">
            <div class="field">
              <label for="qcount">Questions</label>
              <input type="number" id="qcount" min="1" max="210" value="20" />
            </div>
            <div class="field">
              <span class="field-label">Tirage</span>
              <div class="mode-btns" id="mode-list" role="group" aria-label="Tirage">
                <button type="button" class="mode-btn" data-mode="shuffle" aria-pressed="true">Aléatoire</button>
                <button type="button" class="mode-btn" data-mode="order" aria-pressed="false">Ordre</button>
              </div>
            </div>
          </div>
          <div class="pool-stats" id="pool-hint" aria-live="polite"></div>
          <div class="actions">
            <button type="button" class="btn" id="btn-start">Commencer</button>
          </div>
        </div>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="hidden">
      <header class="quiz-bar">
        <h1 class="page-title">QCM</h1>
        <div class="meta" id="progress">—</div>
      </header>
      <div class="panel revealed-host" id="panel">
        <p class="stem" id="stem"></p>
        <div class="q-img-wrap hidden" id="q-img-wrap"><img id="q-img" alt="Schéma de la question" /></div>
        <div id="choices"></div>
        <div class="score-box" id="item-score"></div>
        <div class="actions">
          <button type="button" class="btn" id="btn-validate">Valider</button>
          <button type="button" class="btn secondary" id="btn-next" disabled>Suivant</button>
          <button type="button" class="btn secondary" id="btn-abort">Sortir</button>
        </div>
        <div class="tags" id="tags"></div>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="results" class="hidden">
      <h1 class="page-title">Résultat</h1>
      <p class="sub" id="results-sub">—</p>
      <div class="panel">
        <div class="meta">Score</div>
        <div class="big-score" id="final-score">—</div>
        <p id="final-label"></p>
        <div class="feedback-block">
          <h3>Feedback</h3>
          <p id="feedback-text"></p>
        </div>
        <div class="feedback-block">
          <h3>Conseils</h3>
          <ul id="advice-list"></ul>
          <div class="weak-tags" id="weak-tags"></div>
        </div>
        <p class="recap" id="recap"></p>
        <div class="actions">
          <button type="button" class="btn" id="btn-retry">Rejouer</button>
          <button type="button" class="btn secondary" id="btn-retry-wrong" disabled>Ratés</button>
          <button type="button" class="btn secondary" id="btn-home">Réglages</button>
        </div>
        <div class="next-links" id="next-links" aria-label="Suite"></div>
      </div>
    </section>
  </div>

  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
  <script src="./js/shell-tabbar.js?v=4"></script>

  <script src="./js/suivi-store.js?v=4"></script>
  <script src="./data/lots-index.js?v=1"></script>
  <script src="./js/qcm-player.js?v=1"></script>

</body>
</html>
