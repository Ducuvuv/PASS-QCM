<script>
(function(){
  var DURATION=45*60, SCORE_KEY="pass_sujets_scores_v1", sujetId="SC02";
  var pack=window.SC02_DATA||{};
  var meta=pack.meta||{};
  var items=pack.items||[];
  var index=0, answers={}, remaining=DURATION, tickId=null, finished=false;

  var intro=document.getElementById("intro");
  var quiz=document.getElementById("quiz");
  var end=document.getElementById("end");
  var titleEl=document.getElementById("title");
  var progress=document.getElementById("progress");
  var chLine=document.getElementById("chLine");
  var stem=document.getElementById("stem");
  var choices=document.getElementById("choices");
  var dots=document.getElementById("dots");
  var timerEl=document.getElementById("timer");
  var btnStart=document.getElementById("btnStart");

  document.getElementById("introTitle").textContent=meta.title||"Blanc SC02";
  document.getElementById("introSub").textContent=items.length+" questions · 45 minutes · corrigé à la fin";
  document.getElementById("loadStatus").textContent="Prêt — "+items.length+" questions (intégrées).";
  if(!items.length){
    document.getElementById("loadStatus").textContent="Erreur: aucune question.";
    btnStart.disabled=true;
  }

  function show(n){intro.classList.toggle("hidden",n!=="intro");quiz.classList.toggle("hidden",n!=="quiz");end.classList.toggle("hidden",n!=="end");}
  function norm(a){return (a||[]).slice().map(String).sort().join(",");}
  function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
  function updateTimer(){timerEl.textContent=fmt(remaining);timerEl.className="timer"+(remaining<=60?" danger":remaining<=300?" warn":"");}
  function stopTimer(){if(tickId){clearInterval(tickId);tickId=null;}}
  function startTimer(){stopTimer();remaining=DURATION;updateTimer();tickId=setInterval(function(){remaining-=1;if(remaining<=0){remaining=0;updateTimer();stopTimer();finish(true);return;}updateTimer();},1000);}
  function saveAnswers(){var sel=[];choices.querySelectorAll("input:checked").forEach(function(el){sel.push(el.value);});answers[index]=sel;}
  function buildDots(){dots.innerHTML="";for(var i=0;i<items.length;i++){(function(qi){var b=document.createElement("button");b.type="button";b.textContent=String(qi+1);if(qi===index)b.classList.add("on");if((answers[qi]||[]).length)b.classList.add("filled");b.onclick=function(){saveAnswers();index=qi;render();};dots.appendChild(b);})(i);}}
  function render(){
    var item=items[index]; if(!item) return;
    progress.textContent=(index+1)+" / "+items.length;
    chLine.innerHTML='<span class="chip">ch.'+item.chapter+"</span>";
    stem.textContent=item.stem;
    choices.innerHTML="";
    var selected=answers[index]||[];
    ["A","B","C","D","E"].forEach(function(letter){
      var label=document.createElement("label");
      label.className="choice";
      var checked=selected.indexOf(letter)>=0?" checked":"";
      label.innerHTML='<input type="checkbox" value="'+letter+'"'+checked+" /><span><strong>"+letter+".</strong> "+(item.choices[letter]||"")+"</span>";
      choices.appendChild(label);
    });
    document.getElementById("btnPrev").disabled=index===0;
    document.getElementById("btnNext").textContent=index===items.length-1?"Terminer":"Suivant";
    buildDots();
  }
  function scoreAll(){var ok=0,detail=[];for(var i=0;i<items.length;i++){var item=items[i],user=answers[i]||[],good=norm(user)===norm(item.answer||[]);if(good)ok++;detail.push({i:i,item:item,user:user,ok:good});}return {ok:ok,n:items.length,detail:detail};}
  function renderCorrige(detail){
    var root=document.getElementById("corrige"); root.innerHTML="";
    detail.forEach(function(d){
      var item=d.item, box=document.createElement("div"); box.className="card corrige-item";
      var html="<h3>Q"+(d.i+1)+" · ch."+item.chapter+' · <span class="mark '+(d.ok?"ok":"bad")+'">'+(d.ok?"OK":"A revoir")+"</span></h3>";
      html+='<p class="stem">'+item.stem+"</p>";
      html+='<p class="user-ans">Ta reponse : <strong>'+(d.user.length?d.user.join(", "):"(rien)")+"</strong> · Corrige : <strong>"+(item.answer||[]).join(", ")+"</strong></p>";
      ["A","B","C","D","E"].forEach(function(letter){
        var exp=(item.explanations||{})[letter]||{}, isCorrect=!!exp.correct, userPicked=d.user.indexOf(letter)>=0;
        var cls="choice "+(isCorrect?"ok":"bad"); if(userPicked&&!isCorrect) cls+=" user-miss";
        html+='<div class="'+cls+'"><span><strong>'+letter+".</strong> "+(item.choices[letter]||"")+'<div class="why"><span class="mark '+(isCorrect?"ok":"bad")+'">'+(isCorrect?"Vrai":"Faux")+"</span> — "+(exp.why||"")+(userPicked?" · (tu as coche)":"")+"</div></span></div>";
      });
      box.innerHTML=html; root.appendChild(box);
    });
  }
  function saveScore(p){try{var data=JSON.parse(localStorage.getItem(SCORE_KEY)||"{}");data[sujetId]={ok:p.ok||0,n:p.n||0,pct:p.pct||0,elapsedSec:p.elapsedSec||0,timedOut:!!p.timedOut,title:p.title||sujetId,at:new Date().toISOString()};localStorage.setItem(SCORE_KEY,JSON.stringify(data));}catch(e){}}
  function finish(fromTimer){
    if(finished)return; finished=true; saveAnswers(); stopTimer();
    var scored=scoreAll(), pct=scored.n?Math.round((scored.ok/scored.n)*100):0, elapsed=Math.max(0,DURATION-remaining);
    saveScore({ok:scored.ok,n:scored.n,pct:pct,elapsedSec:elapsed,timedOut:!!fromTimer,title:meta.title||sujetId});
    document.getElementById("endScore").textContent=scored.ok+" / "+scored.n;
    document.getElementById("endLabel").textContent=pct+" %";
    document.getElementById("endSub").textContent=meta.title||sujetId;
    document.getElementById("endTime").textContent=fromTimer?"Temps ecoule (45:00).":"Temps utilise : "+fmt(elapsed)+" / 45:00";
    document.getElementById("endFb").textContent=pct>=85?"Excellent blanc.":pct>=65?"Bon niveau — revois les Q ratees.":pct>=40?"Base fragile en transversal.":"Priorise le cours.";
    renderCorrige(scored.detail); show("end"); window.scrollTo(0,0);
  }
  function startExam(){finished=false;answers={};index=0;titleEl.textContent=meta.title||sujetId;show("quiz");startTimer();render();}
  btnStart.onclick=startExam;
  document.getElementById("btnPrev").onclick=function(){saveAnswers();if(index>0){index-=1;render();}};
  document.getElementById("btnNext").onclick=function(){saveAnswers();if(index>=items.length-1){if(confirm("Terminer et voir score + corrige ?"))finish(false);return;}index+=1;render();};
  document.getElementById("btnFinish").onclick=function(){saveAnswers();if(confirm("Terminer et voir score + corrige ?"))finish(false);};
  document.getElementById("btnAgain").onclick=function(){show("intro");};
})();
</script>
