<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planning &mdash; PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=da6" />
</head>
<body class="has-tabbar" data-tab="plus">
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS</a>
      </div>
    </header>

    <h1 class="page-title">Planning</h1>

    <div class="today-box" id="today-box">
      <h2 id="today-title">Aujourd&rsquo;hui</h2>
      <div id="today-list"></div>
    </div>

    <div class="sel-bar" id="sel-bar" hidden>Chapitre : &mdash;</div>

    <h2 class="plan-step">1. Chapitre</h2>
    <div class="plan-bank" id="chapter-bank"></div>

    <h2 class="plan-step">2. Jour</h2>
    <div class="plan-week-nav">
      <button type="button" class="btn secondary tiny" id="btn-prev">&lsaquo; Semaine</button>
      <strong id="week-label">&mdash;</strong>
      <button type="button" class="btn secondary tiny" id="btn-next">Semaine &rsaquo;</button>
    </div>
    <div class="plan-day-stack" id="week-grid"></div>

    <details class="legend-fold" style="margin-top:1.25rem">
      <summary>Activit&eacute;</summary>
      <div class="table-wrap">
        <table class="suivi-table" id="activity-table">
          <thead>
            <tr>
              <th>Chapitre</th>
              <th>QCM</th>
              <th>Fiche</th>
              <th>Planning</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </div>

  <script src="./js/suivi-store.js?v=5"></script>
  <script src="./js/today-target.js?v=1"></script>
  <script src="./js/planning-store.js?v=3"></script>
  <script>
    const P = window.PASS_PLANNING;
    const S = window.PASS_SUIVI;
    const T = window.PASS_TODAY;
    const DAYS = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
    let weekOffset = 0;
    let selectedChapter = null;
    let dragChapter = null;
    let dragPlacementId = null;

    function startOfWeek(offsetWeeks) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day + offsetWeeks * 7);
      return d;
    }

    function iso(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function fmtShort(isoOrNull) {
      if (!isoOrNull) return "\u2014";
      const s = String(isoOrNull);
      const day = s.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(day)) {
        const parts = day.split("-");
        return parts[2] + "/" + parts[1];
      }
      return "\u2014";
    }

    function weekDates() {
      const start = startOfWeek(weekOffset);
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        return d;
      });
    }

    function chapterLevel(ch) {
      if (!S) return "none";
      const row = (S.getAnatomie() || {})[ch];
      if (!row) return "none";
      const lastReady = (row.lastN || 0) >= S.MIN_Q;
      const cumulReady = (row.n || 0) >= S.MIN_Q;
      const last = lastReady ? row.lastLevel || "none" : "none";
      const cumul = cumulReady ? row.level || "none" : "none";
      if (last === "red" || cumul === "red") return "red";
      if (last === "blue" || cumul === "blue") return "blue";
      if (last === "green" || cumul === "green") return "green";
      return "none";
    }

    function updateSelBar() {
      const bar = document.getElementById("sel-bar");
      if (selectedChapter) {
        bar.hidden = false;
        bar.textContent =
          "Chapitre s\u00e9lectionn\u00e9 : " +
          selectedChapter +
          " \u00b7 " +
          (P.CHAPTERS[selectedChapter] || "") +
          " \u2014 touche un jour";
      } else {
        bar.hidden = true;
      }
    }

    function renderBank() {
      const bank = document.getElementById("chapter-bank");
      bank.innerHTML = "";
      for (const ch of P.CHAPTER_ORDER) {
        const title = P.CHAPTERS[ch];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "plan-chip" + (selectedChapter === ch ? " selected" : "");
        btn.draggable = true;
        btn.textContent = ch + " \u00b7 " + title;
        btn.dataset.chapter = ch;
        btn.addEventListener("click", () => {
          selectedChapter = selectedChapter === ch ? null : ch;
          updateSelBar();
          renderBank();
        });
        btn.addEventListener("dragstart", (e) => {
          dragChapter = ch;
          dragPlacementId = null;
          e.dataTransfer.setData("text/plain", ch);
          e.dataTransfer.effectAllowed = "copyMove";
        });
        bank.appendChild(btn);
      }
    }

    function targetMeta(target) {
      if (!target) return "";
      if (target.reason === "review") {
        return target.level === "red" ? "Priorit\u00e9" : "Consolider";
      }
      if (target.reason === "start") return "D\u00e9marrer";
      return "Reprise";
    }

    function appendTodayRow(list, ch, opts) {
      const level = chapterLevel(ch);
      const div = document.createElement("div");
      div.className = "today-item" + (opts.target ? " is-target" : "");
      const badge = opts.target
        ? ' <span class="today-badge">' + (opts.meta || "Cible") + "</span>"
        : "";
      div.innerHTML =
        '<span class="today-name"><span class="pill pill-' +
        level +
        '"></span> <strong>' +
        ch +
        " \u00b7 " +
        (P.CHAPTERS[ch] || "") +
        "</strong>" +
        badge +
        "</span>" +
        '<span class="ch-actions">' +
        '<a class="btn tiny" href="./qcm-player.html?ch=' +
        ch +
        '">QCM</a>' +
        '<a class="btn tiny secondary" href="./flashcards.html?ch=' +
        ch +
        '&mode=due">Flash</a>' +
        '<a class="btn tiny secondary" href="./matiere/anatomie/ch' +
        ch +
        '.html">Fiche</a>' +
        (opts.id
          ? '<button type="button" class="btn tiny secondary plan-remove" data-id="' +
            opts.id +
            '">Retirer</button>'
          : "") +
        "</span>";
      const rm = div.querySelector(".plan-remove");
      if (rm) {
        rm.addEventListener("click", () => {
          P.removePlacement(opts.id);
          renderAll();
        });
      }
      list.appendChild(div);
    }

    function renderToday() {
      const t = P.todayISO();
      const d = new Date();
      document.getElementById("today-title").textContent =
        "Aujourd\u2019hui \u2014 " + DAYS[(d.getDay() + 6) % 7] + " " + fmtShort(t);
      const list = document.getElementById("today-list");
      list.innerHTML = "";
      const shown = new Set();

      const target = T ? T.getTodayTarget() : null;
      if (target && target.ch) {
        appendTodayRow(list, target.ch, {
          target: true,
          meta: targetMeta(target),
        });
        shown.add(target.ch);
      }

      P.placementsOn(t).forEach((p) => {
        if (shown.has(p.chapter)) return;
        appendTodayRow(list, p.chapter, { id: p.id });
        shown.add(p.chapter);
      });

      if (!list.children.length) {
        list.innerHTML =
          '<p class="hint" style="margin:0">Rien aujourd&rsquo;hui.</p>';
      }
    }

    function bindDayDrop(col, dateStr) {
      col.addEventListener("dragover", (e) => {
        e.preventDefault();
        col.classList.add("drag-over");
      });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("drag-over");
        if (dragPlacementId) P.movePlacement(dragPlacementId, dateStr);
        else if (dragChapter || selectedChapter) P.placeChapter(dragChapter || selectedChapter, dateStr);
        dragChapter = null;
        dragPlacementId = null;
        selectedChapter = null;
        updateSelBar();
        renderAll();
      });
    }

    function renderWeek() {
      const dates = weekDates();
      document.getElementById("week-label").textContent =
        fmtShort(iso(dates[0])) + " \u2014 " + fmtShort(iso(dates[6])) + " \u00b7 " + dates[0].getFullYear();

      const grid = document.getElementById("week-grid");
      grid.innerHTML = "";
      const today = P.todayISO();

      dates.forEach((d, i) => {
        const dateStr = iso(d);
        const col = document.createElement("div");
        col.className = "plan-day-row" + (dateStr === today ? " is-today" : "");
        col.dataset.date = dateStr;

        const head = document.createElement("div");
        head.className = "day-head";
        head.innerHTML =
          "<span>" +
          DAYS[i] +
          " " +
          fmtShort(dateStr) +
          "</span><span>" +
          (dateStr === today ? "Aujourd\u2019hui" : "") +
          "</span>";
        col.appendChild(head);

        const chips = document.createElement("div");
        chips.className = "day-chips";
        P.placementsOn(dateStr).forEach((p) => {
          const level = chapterLevel(p.chapter);
          const chip = document.createElement("div");
          chip.className = "day-chip";
          chip.draggable = true;
          chip.innerHTML =
            '<span class="pill pill-' +
            level +
            '"></span> <span>' +
            p.chapter +
            "</span>" +
            '<button type="button" class="plan-x" aria-label="Retirer">&times;</button>';
          chip.querySelector(".plan-x").addEventListener("click", (e) => {
            e.stopPropagation();
            P.removePlacement(p.id);
            renderAll();
          });
          chip.addEventListener("dragstart", (e) => {
            e.stopPropagation();
            dragPlacementId = p.id;
            dragChapter = null;
            e.dataTransfer.setData("text/plain", p.id);
            e.dataTransfer.effectAllowed = "move";
          });
          chips.appendChild(chip);
        });
        col.appendChild(chips);

        col.addEventListener("click", () => {
          if (!selectedChapter) {
            const bar = document.getElementById("sel-bar");
            bar.hidden = false;
            bar.textContent = "Chapitre d\u2019abord";
            return;
          }
          P.placeChapter(selectedChapter, dateStr);
          selectedChapter = null;
          updateSelBar();
          renderAll();
        });
        bindDayDrop(col, dateStr);
        grid.appendChild(col);
      });
    }

    function renderActivity() {
      const tbody = document.querySelector("#activity-table tbody");
      tbody.innerHTML = "";
      const all = P.getAllActivity();
      for (const ch of P.CHAPTER_ORDER) {
        const a = all[ch] || {};
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td><strong>" +
          ch +
          "</strong> \u2014 " +
          P.CHAPTERS[ch] +
          "</td><td>" +
          fmtShort(a.lastQcmAt) +
          "</td><td>" +
          fmtShort(a.lastFicheAt) +
          "</td><td>" +
          fmtShort(a.lastPlanningAt) +
          "</td>";
        tbody.appendChild(tr);
      }
    }

    function renderAll() {
      renderBank();
      renderToday();
      renderWeek();
      renderActivity();
    }

    document.getElementById("btn-prev").addEventListener("click", () => {
      weekOffset -= 1;
      renderWeek();
    });
    document.getElementById("btn-next").addEventListener("click", () => {
      weekOffset += 1;
      renderWeek();
    });

    renderAll();
  </script><nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
<script src="./js/shell-tabbar.js?v=4"></script>
</body>
</html>
