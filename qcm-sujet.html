<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sujet complet — PASS Sorbonne</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f3efe6; --card:#faf7f0; --ink:#1a2a22; --muted:#5a6a60;
      --line:#cfc6b4; --ok:#166534; --ok-bg:#dcfce7; --bad:#991b1b;
      --bad-bg:#fee2e2; --accent:#1f5c45; --warn:#b45309;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--ink);line-height:1.45;background:radial-gradient(90% 60% at 100% 0%,#e5ecdf,transparent 50%),var(--bg)}
    main{max-width:42rem;margin:0 auto;padding:1.25rem 1rem 3rem}
    h1{font-size:1.2rem;margin:0 0 .35rem}
    h2{font-size:1.05rem;margin:0 0 .5rem}
    .meta,.sub{color:var(--muted);font-size:.95rem}
    .sub{margin:0 0 1rem}
    a{color:inherit}
    .hidden{display:none!important}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.15rem;margin-bottom:1rem}
    .bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;align-items:center;margin-bottom:1rem;position:sticky;top:0;z-index:5;background:rgba(243,239,230,.94);padding:.55rem 0}
    .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--card);min-width:5.5rem;text-align:center}
    .timer.warn{color:var(--warn);border-color:#f59e0b}
    .timer.danger{color:var(--bad);border-color:#f87171}
    .stem{font-size:1.05rem;margin:0 0 1rem}
    .choice{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem .7rem;border:1px solid var(--line);border-radius:10px;margin-bottom:.5rem;cursor:pointer;background:var(--card)}
    .choice:has(input:checked){border-color:var(--accent);background:#e3efe8}
    .choice.ok{border-color:#86efac;background:var(--ok-bg)}
    .choice.bad{border-color:#fca5a5;background:var(--bad-bg)}
    .choice.user-miss{outline:2px dashed #f87171}
    .why{margin-top:.35rem;font-size:.88rem;color:var(--muted)}
    .mark{font-weight:700}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
    .actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
    button,.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:.55rem 1rem;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;display:inline-block}
    button.secondary,a.secondary{background:var(--card);color:var(--ink);border-color:var(--line)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .chip{display:inline-block;font-size:.75rem;padding:.15rem .45rem;border-radius:6px;background:#e5ecdf;color:var(--accent)}
    .big{font-size:2.2rem;font-weight:700;margin:.25rem 0 .5rem}
    .nav-dots{display:flex;flex-wrap:wrap;gap:.3rem;margin:.75rem 0 0}
    .nav-dots button{min-width:2rem;padding:.25rem .4rem;border-radius:8px;font-size:.8rem;font-weight:700;background:var(--card);color:var(--ink);border:1px solid var(--line)}
    .nav-dots button.on{border-color:var(--accent);background:#e3efe8}
    .nav-dots button.filled{background:#dbe7df}
    .corrige-item{margin-bottom:1.25rem}
    .corrige-item h3{font-size:.95rem;margin:0 0 .5rem}
    .user-ans{font-size:.9rem;color:var(--muted);margin:.35rem 0 .5rem}
    .err{color:var(--bad);font-weight:650}
  </style>
</head>
<body>
  <main>
    <p class="meta" style="margin:0 0 .75rem">
      <a href="./sujets-complets.html">← Sujets complets</a>
      · <a href="./entrainement.html">Entraînement</a>
    </p>

    <section id="intro">
      <h1 id="introTitle">Blanc SC01</h1>
      <p class="sub" id="introSub">Chargement des questions…</p>
      <div class="card">
        <p>Mode concours : 45 min, pas de corrigé pendant l’épreuve. À la fin → score + corrigé complet.</p>
        <p id="loadStatus" class="sub">Préparation…</p>
        <div class="actions">
          <button type="button" id="btnStart" disabled>Commencer le blanc (45 min)</button>
          <a class="secondary btn" href="./sujets-complets.html">Retour</a>
        </div>
      </div>
    </section>

    <section id="quiz" class="hidden">
      <div class="bar">
        <div>
          <h1 id="title" style="margin:0">Sujet</h1>
          <div class="meta" id="progress">—</div>
        </div>
        <div class="timer" id="timer">45:00</div>
      </div>
      <div class="card">
        <p class="meta" id="chLine" style="margin:0 0 .5rem"></p>
        <p class="stem" id="stem"></p>
        <div id="choices"></div>
        <div class="nav-dots" id="dots"></div>
        <div class="actions">
          <button type="button" class="secondary" id="btnPrev">Précédent</button>
          <button type="button" id="btnNext">Suivant</button>
          <button type="button" class="secondary" id="btnFinish">Terminer</button>
        </div>
      </div>
    </section>

    <section id="end" class="hidden">
      <h1>Fin du blanc</h1>
      <p class="sub" id="endSub">—</p>
      <div class="card">
        <div class="meta">Score</div>
        <div class="big" id="endScore">—</div>
        <p id="endLabel"></p>
        <p id="endTime" class="meta"></p>
        <p id="endFb"></p>
        <div class="actions">
          <button type="button" id="btnAgain">Refaire</button>
          <a class="secondary btn" href="./sujets-complets.html">Menu sujets</a>
        </div>
      </div>
      <h2 style="margin-top:1.5rem">Corrigé complet</h2>
      <div id="corrige"></div>
    </section>
  </main>

  <script>
  (function () {
    var DURATION = 45 * 60;
    var SCORE_KEY = "pass_sujets_scores_v1";
    var sujetId = (new URLSearchParams(location.search).get("id") || "SC01").toUpperCase();

    var intro = document.getElementById("intro");
    var quiz = document.getElementById("quiz");
    var end = document.getElementById("end");
    var loadStatus = document.getElementById("loadStatus");
    var btnStart = document.getElementById("btnStart");
    var titleEl = document.getElementById("title");
    var progress = document.getElementById("progress");
    var chLine = document.getElementById("chLine");
    var stem = document.getElementById("stem");
    var choices = document.getElementById("choices");
    var dots = document.getElementById("dots");
    var timerEl = document.getElementById("timer");

    var items = [];
    var meta = {};
    var index = 0;
    var answers = {};
    var remaining = DURATION;
    var tickId = null;
    var finished = false;
    var ready = false;

    function show(name) {
      intro.classList.toggle("hidden", name !== "intro");
      quiz.classList.toggle("hidden", name !== "quiz");
      end.classList.toggle("hidden", name !== "end");
    }

    function saveScore(payload) {
      try {
        var data = JSON.parse(localStorage.getItem(SCORE_KEY) || "{}");
        data[sujetId] = {
          ok: payload.ok || 0,
          n: payload.n || 0,
          pct: payload.pct || 0,
          elapsedSec: payload.elapsedSec || 0,
          timedOut: !!payload.timedOut,
          title: payload.title || sujetId,
          at: new Date().toISOString()
        };
        localStorage.setItem(SCORE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function norm(arr) {
      return (arr || []).slice().map(String).sort().join(",");
    }

    function fmt(sec) {
      var m = Math.floor(sec / 60), s = sec % 60;
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }

    function updateTimer() {
      timerEl.textContent = fmt(remaining);
      timerEl.className = "timer" + (remaining <= 60 ? " danger" : remaining <= 300 ? " warn" : "");
    }

    function stopTimer() {
      if (tickId) { clearInterval(tickId); tickId = null; }
    }

    function startTimer() {
      stopTimer();
      remaining = DURATION;
      updateTimer();
      tickId = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          updateTimer();
          stopTimer();
          finish(true);
          return;
        }
        updateTimer();
      }, 1000);
    }

    function saveAnswers() {
      var sel = [];
      choices.querySelectorAll("input:checked").forEach(function (el) { sel.push(el.value); });
      answers[index] = sel;
    }

    function buildDots() {
      dots.innerHTML = "";
      for (var i = 0; i < items.length; i++) {
        (function (qi) {
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = String(qi + 1);
          if (qi === index) b.classList.add("on");
          if ((answers[qi] || []).length) b.classList.add("filled");
          b.onclick = function () { saveAnswers(); index = qi; render(); };
          dots.appendChild(b);
        })(i);
      }
    }

    function render() {
      var item = items[index];
      if (!item) return;
      progress.textContent = (index + 1) + " / " + items.length;
      chLine.innerHTML = '<span class="chip">ch.' + item.chapter + "</span>";
      stem.textContent = item.stem;
      choices.innerHTML = "";
      var selected = answers[index] || [];
      ["A", "B", "C", "D", "E"].forEach(function (letter) {
        var label = document.createElement("label");
        label.className = "choice";
        var checked = selected.indexOf(letter) >= 0 ? " checked" : "";
        label.innerHTML =
          '<input type="checkbox" value="' + letter + '"' + checked + " />" +
          "<span><strong>" + letter + ".</strong> " + (item.choices[letter] || "") + "</span>";
        choices.appendChild(label);
      });
      document.getElementById("btnPrev").disabled = index === 0;
      document.getElementById("btnNext").textContent =
        index === items.length - 1 ? "Terminer" : "Suivant";
      buildDots();
    }

    function scoreAll() {
      var ok = 0, detail = [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var user = answers[i] || [];
        var good = norm(user) === norm(item.answer || []);
        if (good) ok += 1;
        detail.push({ i: i, item: item, user: user, ok: good });
      }
      return { ok: ok, n: items.length, detail: detail };
    }

    function renderCorrige(detail) {
      var root = document.getElementById("corrige");
      root.innerHTML = "";
      detail.forEach(function (d) {
        var item = d.item;
        var box = document.createElement("div");
        box.className = "card corrige-item";
        var html =
          "<h3>Q" + (d.i + 1) + " · ch." + item.chapter +
          ' · <span class="mark ' + (d.ok ? "ok" : "bad") + '">' +
          (d.ok ? "OK" : "A revoir") + "</span></h3>" +
          '<p class="stem">' + item.stem + "</p>" +
          '<p class="user-ans">Ta reponse : <strong>' +
          (d.user.length ? d.user.join(", ") : "(rien)") +
          "</strong> · Corrige : <strong>" + (item.answer || []).join(", ") +
          "</strong></p>";
        ["A", "B", "C", "D", "E"].forEach(function (letter) {
          var exp = (item.explanations || {})[letter] || {};
          var isCorrect = !!exp.correct;
          var userPicked = d.user.indexOf(letter) >= 0;
          var cls = "choice " + (isCorrect ? "ok" : "bad");
          if (userPicked && !isCorrect) cls += " user-miss";
          html +=
            '<div class="' + cls + '"><span><strong>' + letter + ".</strong> " +
            (item.choices[letter] || "") +
            '<div class="why"><span class="mark ' + (isCorrect ? "ok" : "bad") + '">' +
            (isCorrect ? "Vrai" : "Faux") + "</span> — " + (exp.why || "") +
            (userPicked ? " · (tu as coche)" : "") +
            "</div></span></div>";
        });
        box.innerHTML = html;
        root.appendChild(box);
      });
    }

    function finish(fromTimer) {
      if (finished) return;
      finished = true;
      saveAnswers();
      stopTimer();
      var scored = scoreAll();
      var pct = scored.n ? Math.round((scored.ok / scored.n) * 100) : 0;
      var elapsed = Math.max(0, DURATION - remaining);

      saveScore({
        ok: scored.ok, n: scored.n, pct: pct,
        elapsedSec: elapsed, timedOut: !!fromTimer,
        title: meta.title || sujetId
      });

      document.getElementById("endScore").textContent = scored.ok + " / " + scored.n;
      document.getElementById("endLabel").textContent = pct + " %";
      document.getElementById("endSub").textContent = meta.title || sujetId;
      document.getElementById("endTime").textContent = fromTimer
        ? "Temps ecoule (45:00)."
        : "Temps utilise : " + fmt(elapsed) + " / 45:00";
      document.getElementById("endFb").textContent =
        pct >= 85 ? "Excellent blanc." :
        pct >= 65 ? "Bon niveau — revois les Q ratees ci-dessous." :
        pct >= 40 ? "Base fragile en transversal." :
        "Priorise le cours avant de retenter.";

      renderCorrige(scored.detail);
      show("end");
      window.scrollTo(0, 0);
    }

    function startExam() {
      if (!ready) return;
      finished = false;
      answers = {};
      index = 0;
      titleEl.textContent = meta.title || sujetId;
      show("quiz");
      startTimer();
      render();
    }

    function onLoaded(pack) {
      meta = pack.meta || {};
      items = pack.items || [];
      if (!items.length) {
        loadStatus.innerHTML = '<span class="err">Sujet vide.</span>';
        return;
      }
      ready = true;
      document.getElementById("introTitle").textContent = meta.title || sujetId;
      document.getElementById("introSub").textContent =
        items.length + " questions · 45 minutes · corrige a la fin.";
      loadStatus.textContent = "Pret — " + items.length + " questions chargees.";
      btnStart.disabled = false;
    }

    // Fetch JSON (fiable sur telephone) — fallback script.js
    var urlJson = "./data/sujets/sc01.json?v=sc01e";
    loadStatus.textContent = "Telechargement des questions…";
    fetch(urlJson)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(onLoaded)
      .catch(function (err1) {
        loadStatus.textContent = "JSON KO, essai script… (" + err1.message + ")";
        var s = document.createElement("script");
        s.src = "./data/sujets/sc01.js?v=sc01e";
        s.onload = function () {
          var pack = (window.PASS_SUJETS || {})[sujetId] || (window.PASS_SUJETS || {}).SC01;
          if (!pack) {
            loadStatus.innerHTML = '<span class="err">Impossible de charger le sujet. Refresh.</span>';
            return;
          }
          onLoaded(pack);
        };
        s.onerror = function () {
          loadStatus.innerHTML = '<span class="err">Echec chargement sc01. Verifie le reseau.</span>';
        };
        document.head.appendChild(s);
      });

    btnStart.onclick = startExam;
    document.getElementById("btnPrev").onclick = function () {
      saveAnswers();
      if (index > 0) { index -= 1; render(); }
    };
    document.getElementById("btnNext").onclick = function () {
      saveAnswers();
      if (index >= items.length - 1) {
        if (confirm("Terminer et voir score + corrige ?")) finish(false);
        return;
      }
      index += 1;
      render();
    };
    document.getElementById("btnFinish").onclick = function () {
      saveAnswers();
      if (confirm("Terminer et voir score + corrige ?")) finish(false);
    };
    document.getElementById("btnAgain").onclick = function () { show("intro"); };
  })();
  </script>
</body>
</html>
