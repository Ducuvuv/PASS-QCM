<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sujet complet — PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6; --card: #faf7f0; --ink: #1a2a22; --muted: #5a6a60;
      --line: #cfc6b4; --ok: #166534; --ok-bg: #dcfce7; --bad: #991b1b;
      --bad-bg: #fee2e2; --accent: #1f5c45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Manrope", system-ui, sans-serif; color: var(--ink); line-height: 1.45;
      background: radial-gradient(90% 60% at 100% 0%, #e5ecdf, transparent 50%), var(--bg);
    }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    h1 { font-size: 1.2rem; margin: 0 0 0.35rem; }
    .meta, .sub { color: var(--muted); font-size: 0.95rem; }
    .sub { margin: 0 0 1rem; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 1.1rem 1.15rem; margin-bottom: 1rem;
    }
    .bar {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 0.75rem; align-items: center; margin-bottom: 1rem;
    }
    .stem { font-size: 1.05rem; margin: 0 0 1rem; }
    .choice {
      display: flex; gap: 0.65rem; align-items: flex-start;
      padding: 0.65rem 0.7rem; border: 1px solid var(--line); border-radius: 10px;
      margin-bottom: 0.5rem; cursor: pointer; background: var(--card);
    }
    .choice:has(input:checked) { border-color: var(--accent); background: #e3efe8; }
    .choice.ok { border-color: #86efac; background: var(--ok-bg); }
    .choice.bad { border-color: #fca5a5; background: var(--bad-bg); }
    .why { display: none; margin-top: 0.35rem; font-size: 0.88rem; color: var(--muted); }
    .revealed .why { display: block; }
    .mark { font-weight: 700; }
    .mark.ok { color: var(--ok); }
    .mark.bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    button, .btn {
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      border-radius: 999px; padding: 0.55rem 1rem; font: inherit; font-weight: 650;
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    button.secondary, a.secondary {
      background: var(--card); color: var(--ink); border-color: var(--line);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .score {
      margin-top: 0.85rem; padding: 0.7rem 0.8rem; border-radius: 10px;
      background: #ebe6dc; display: none;
    }
    .score.on { display: block; }
    .tags { margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); }
    .big { font-size: 2.2rem; font-weight: 700; margin: 0.25rem 0 0.5rem; }
    .chip {
      display: inline-block; font-size: 0.75rem; padding: 0.15rem 0.45rem;
      border-radius: 6px; background: #e5ecdf; color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <p class="meta" style="margin:0 0 0.75rem">
      <a href="./sujets-complets.html">← Sujets complets</a>
      · <a href="./entrainement.html">Entraînement</a>
    </p>

    <section id="boot">
      <h1>Chargement du sujet…</h1>
      <p class="sub" id="bootMsg">Un instant.</p>
    </section>

    <section id="quiz" class="hidden">
      <div class="bar">
        <h1 id="title">Sujet</h1>
        <div class="meta" id="progress">—</div>
      </div>
      <div class="card" id="panel">
        <p class="meta" id="chLine" style="margin:0 0 0.5rem"></p>
        <p class="stem" id="stem"></p>
        <div id="choices"></div>
        <div class="score" id="itemScore"></div>
        <div class="actions">
          <button type="button" id="btnOk">Valider / Corrigé</button>
          <button type="button" class="secondary" id="btnNext" disabled>Suivant</button>
          <button type="button" class="secondary" id="btnQuit">Abandonner</button>
        </div>
        <div class="tags" id="tags"></div>
      </div>
    </section>

    <section id="end" class="hidden">
      <h1>Fin du sujet</h1>
      <p class="sub" id="endSub">—</p>
      <div class="card">
        <div class="meta">Score</div>
        <div class="big" id="endScore">—</div>
        <p id="endLabel"></p>
        <p id="endFb"></p>
        <div class="actions">
          <button type="button" id="btnAgain">Rejouer</button>
          <a class="secondary btn" href="./sujets-complets.html">Autres sujets</a>
        </div>
      </div>
    </section>
  </main>

  <script src="./data/sujets/catalog.js?v=sc01b"></script>
  <script>
    (function () {
      var sujetId = (new URLSearchParams(location.search).get("id") || "SC01").toUpperCase();
      var catalog = window.PASS_SUJET_CATALOG || [];
      var entry = null;
      for (var i = 0; i < catalog.length; i++) {
        if (String(catalog[i].id).toUpperCase() === sujetId) {
          entry = catalog[i];
          break;
        }
      }
      if (!entry) {
        entry = { id: "SC01", title: "Blanc SC01", file: "sc01.js" };
      }

      var boot = document.getElementById("boot");
      var bootMsg = document.getElementById("bootMsg");
      var quiz = document.getElementById("quiz");
      var end = document.getElementById("end");
      var titleEl = document.getElementById("title");
      var progress = document.getElementById("progress");
      var chLine = document.getElementById("chLine");
      var stem = document.getElementById("stem");
      var choices = document.getElementById("choices");
      var itemScore = document.getElementById("itemScore");
      var tags = document.getElementById("tags");
      var panel = document.getElementById("panel");
      var btnOk = document.getElementById("btnOk");
      var btnNext = document.getElementById("btnNext");
      var btnQuit = document.getElementById("btnQuit");
      var btnAgain = document.getElementById("btnAgain");

      var items = [];
      var meta = {};
      var index = 0;
      var revealed = false;
      var correctCount = 0;

      function show(which) {
        boot.classList.toggle("hidden", which !== "boot");
        quiz.classList.toggle("hidden", which !== "quiz");
        end.classList.toggle("hidden", which !== "end");
      }

      function norm(arr) {
        return arr.slice().map(String).sort().join(",");
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = function () {
            reject(new Error("Impossible de charger " + src));
          };
          document.head.appendChild(s);
        });
      }

      function start() {
        index = 0;
        revealed = false;
        correctCount = 0;
        show("quiz");
        render();
      }

      function render() {
        var item = items[index];
        if (!item) {
          finish();
          return;
        }
        revealed = false;
        panel.classList.remove("revealed");
        itemScore.classList.remove("on");
        itemScore.textContent = "";
        btnOk.disabled = false;
        btnNext.disabled = true;
        progress.textContent = index + 1 + " / " + items.length;
        chLine.innerHTML = '<span class="chip">ch.' + item.chapter + "</span> · " + item.id;
        stem.textContent = item.stem;
        tags.textContent = (item.tags || [])
          .map(function (t) {
            return "#" + t;
          })
          .join("  ");
        choices.innerHTML = "";
        ["A", "B", "C", "D", "E"].forEach(function (letter) {
          var label = document.createElement("label");
          label.className = "choice";
          label.setAttribute("data-letter", letter);
          label.innerHTML =
            '<input type="checkbox" value="' +
            letter +
            '" />' +
            "<span><strong>" +
            letter +
            ".</strong> " +
            (item.choices[letter] || "") +
            '<div class="why"></div></span>';
          choices.appendChild(label);
        });
      }

      function validate() {
        var item = items[index];
        if (!item || revealed) return;
        var selected = [];
        choices.querySelectorAll("input:checked").forEach(function (el) {
          selected.push(el.value);
        });
        var ok = norm(selected) === norm(item.answer || []);
        revealed = true;
        panel.classList.add("revealed");
        btnNext.disabled = false;
        btnOk.disabled = true;
        if (ok) correctCount += 1;

        ["A", "B", "C", "D", "E"].forEach(function (letter) {
          var row = choices.querySelector('[data-letter="' + letter + '"]');
          var exp = (item.explanations || {})[letter] || {};
          var isCorrect = !!exp.correct;
          row.classList.add(isCorrect ? "ok" : "bad");
          row.querySelector("input").disabled = true;
          row.querySelector(".why").innerHTML =
            '<span class="mark ' +
            (isCorrect ? "ok" : "bad") +
            '">' +
            (isCorrect ? "Vrai" : "Faux") +
            "</span> — " +
            (exp.why || "");
        });

        itemScore.classList.add("on");
        itemScore.innerHTML = ok
          ? "<strong>OK</strong> — " + item.answer.join(", ")
          : "<strong>À revoir</strong> — tu : " +
            (selected.length ? selected.join(", ") : "(rien)") +
            " · corrigé : " +
            item.answer.join(", ");
      }

      function finish() {
        var total = items.length;
        var pct = total ? Math.round((correctCount / total) * 100) : 0;
        document.getElementById("endScore").textContent = correctCount + " / " + total;
        document.getElementById("endLabel").textContent = pct + " % de réussite";
        document.getElementById("endSub").textContent = meta.title || entry.title || sujetId;
        var fb = document.getElementById("endFb");
        if (pct >= 85) fb.textContent = "Excellent blanc — tu tiens le rythme concours.";
        else if (pct >= 65)
          fb.textContent = "Bon niveau : revois les items ratés puis refais le sujet dans 48 h.";
        else if (pct >= 40)
          fb.textContent = "Base encore fragile en transversal — cible les chapitres faibles, puis reviens.";
        else fb.textContent = "Priorise le cours sur les chapitres les plus ratés avant un nouveau blanc.";
        show("end");
      }

      function boot() {
        var file = entry.file || "sc01.js";
        loadScript("./data/sujets/" + file + "?v=sc01b")
          .then(function () {
            var pack =
              (window.PASS_SUJETS || {})[entry.id] || (window.PASS_SUJETS || {})[sujetId];
            if (!pack || !pack.items || !pack.items.length) {
              throw new Error("Pack vide pour " + sujetId);
            }
            meta = pack.meta || {};
            items = pack.items;
            titleEl.textContent = meta.title || entry.title || sujetId;
            start();
          })
          .catch(function (e) {
            bootMsg.textContent = String(e.message || e);
          });
      }

      btnOk.addEventListener("click", validate);
      btnNext.addEventListener("click", function () {
        if (!revealed) return;
        index += 1;
        if (index >= items.length) finish();
        else render();
      });
      btnQuit.addEventListener("click", function () {
        if (confirm("Abandonner ce sujet ?")) location.href = "./sujets-complets.html";
      });
      btnAgain.addEventListener("click", start);

      boot();
    })();
  </script>
</body>
</html>
