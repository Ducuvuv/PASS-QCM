  <script>
  (function () {
    var KEY = "pass_sujets_scores_v1";
    function fill(id, elId) {
      var el = document.getElementById(elId);
      if (!el) return;
      try {
        var data = JSON.parse(localStorage.getItem(KEY) || "{}");
        var row = data[id];
        if (!row) return;
        var m = Math.floor((row.elapsedSec || 0) / 60);
        var s = (row.elapsedSec || 0) % 60;
        var t = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        el.classList.remove("empty");
        el.textContent = "Dernier score : " + row.ok + " / " + row.n + " (" + row.pct + " %) · temps " + t;
      } catch (e) {}
    }
    fill("SC01", "scoreSC01");
    fill("SC02", "scoreSC02");
    fill("SC03", "scoreSC03");
    fill("SC04", "scoreSC04");
    fill("SC05", "scoreSC05");
    fill("SC06", "scoreSC06");
    fill("SC07", "scoreSC07");
    fill("SC08", "scoreSC08");
    fill("SC09", "scoreSC09");
    fill("SC10", "scoreSC10");
  })();
  </script>
