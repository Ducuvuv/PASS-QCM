<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=m2" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS Sorbonne</a>
        <span class="site-pill">S1 · Anatomie</span>
      </div>
      <nav aria-label="Navigation principale">
        <ul class="nav-chips">
          <li><a href="./index.html">Accueil</a></li>
          <li><a href="./matiere.html">Matière</a></li>
          <li><a href="./entrainement.html" aria-current="page">Entraînement</a></li>
          <li><a href="./flashcards.html">Flashcards</a></li>
          <li><a href="./suivi.html">Suivi</a></li>
          <li><a href="./planning.html">Planning</a></li>
          <li><a href="./competitions.html">Compétitions</a></li>
          <li><a href="./conseils.html">Conseils</a></li>
        </ul>
      </nav>
    </header>

    <p class="page-sub" style="margin-bottom:0.35rem"><a href="./entrainement.html">← Entraînement</a></p>
    <h1 class="page-title">Sujets complets</h1>
    <p class="page-sub">Blancs transversaux (chapitres 01–11), style concours. Un sujet = un fichier. Objectif : 10 blancs.</p>

    <section class="rubric-panel" id="sujet-list" aria-label="Sujets disponibles"></section>
  </div>

  <script src="./data/sujets/catalog.js"></script>
  <script>
    const list = document.getElementById("sujet-list");
    const catalog = window.PASS_SUJET_CATALOG || [];
    list.innerHTML = "";

    for (const s of catalog) {
      const ready = s.status === "ready";
      const el = document.createElement(ready ? "a" : "div");
      el.className = "rubric-row";
      if (ready) el.href = "./qcm-sujet.html?id=" + encodeURIComponent(s.id);
      else el.style.cursor = "default";
      el.innerHTML =
        "<h2>" + s.title + "</h2>" +
        '<span class="badge' + (ready ? "" : " soon") + '">' + (ready ? "Dispo" : "Bientôt") + "</span>" +
        "<p>" + (s.n || 36) + " QCM · mix chapitres · ordre fixe.</p>";
      list.appendChild(el);
    }

    for (let i = catalog.length + 1; i <= 10; i++) {
      const d = document.createElement("div");
      d.className = "rubric-row";
      d.style.cursor = "default";
      const num = String(i).padStart(2, "0");
      d.innerHTML =
        "<h2>Blanc SC" + num + "</h2>" +
        '<span class="badge soon">Bientôt</span>' +
        "<p>Emplacement réservé — série de 10 sujets complets.</p>";
      list.appendChild(d);
    }
  </script>
</body>
</html>
