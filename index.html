<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=da3" />
</head>
<body class="has-tabbar" data-tab="home">
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS</a>
        <span class="site-pill">Anatomie</span>
      </div>
    </header>

    <section class="continue-card" id="today-card" hidden>
      <p class="continue-kicker" id="today-kicker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/></svg>
        Aujourd’hui
      </p>
      <h2 class="continue-title" id="today-title">—</h2>
      <p class="continue-meta" id="today-meta"></p>
      <div class="continue-actions">
        <a class="btn" id="today-qcm" href="./qcm-player.html">QCM</a>
        <a class="btn secondary" id="today-flash" href="./flashcards.html?mode=due">Flash</a>
        <a class="btn secondary" id="today-fiche" href="./matiere.html">Fiche</a>
      </div>
    </section>

    <p class="eyebrow">Continuer</p>
    <section class="rubric-panel" aria-label="Continuer">
      <a class="rubric-row" href="./entrainement.html">
        <svg class="row-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/></svg>
        <span class="row-body"><h2>Entraînement</h2></span>
        <span class="row-chev">›</span>
      </a>
      <a class="rubric-row" href="./flashcards.html">
        <svg class="row-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="12" height="15" rx="1.5"/><path d="M8 5V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v1"/><path d="M16 9h4v11a1.5 1.5 0 0 1-1.5 1.5H16"/></svg>
        <span class="row-body"><h2>Flashcards</h2></span>
        <span class="row-chev">›</span>
      </a>
      <a class="rubric-row" href="./planning.html">
        <svg class="row-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M3.5 10h17"/></svg>
        <span class="row-body"><h2>Planning</h2></span>
        <span class="row-chev">›</span>
      </a>
    </section>
  </div>

  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
  <script src="./js/shell-tabbar.js?v=2"></script>
  <script src="./js/suivi-store.js?v=5"></script>
  <script src="./js/today-target.js?v=1"></script>
  <script>
    (function () {
      const S = window.PASS_SUIVI;
      const T = window.PASS_TODAY;
      if (!S || !T) return;

      const card = document.getElementById("today-card");
      const title = document.getElementById("today-title");
      const meta = document.getElementById("today-meta");
      const aQcm = document.getElementById("today-qcm");
      const aFlash = document.getElementById("today-flash");
      const aFiche = document.getElementById("today-fiche");

      const target = T.getTodayTarget(true);
      if (!target) return;

      const name = S.CHAPTERS[target.ch] || "";
      const links = T.hrefsFor(target.ch);

      title.textContent = target.ch + " — " + name;
      if (target.reason === "review") {
        meta.textContent = target.level === "red" ? "Priorité faible" : "À consolider";
      } else if (target.reason === "start") {
        meta.textContent = "Premier chapitre";
      } else {
        meta.textContent = "Reprise";
      }

      aQcm.href = links.qcm;
      aFlash.href = links.flash;
      aFiche.href = links.fiche;
      card.hidden = false;
    })();
  </script>
</body>
</html>
