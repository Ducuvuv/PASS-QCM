<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=da4" />
</head>
<body class="has-tabbar" data-tab="home">
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS</a>
        <span class="site-pill">Anatomie</span>
      </div>
    </header>

    <section class="continue-card" id="today-card" hidden>
      <p class="continue-kicker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/></svg>
        Aujourd'hui
      </p>
      <h2 class="continue-title" id="today-title">?</h2>
      <p class="continue-meta" id="today-meta"></p>
      <div class="continue-actions">
        <a class="btn" id="today-qcm" href="./qcm-player.html">QCM</a>
        <a class="btn secondary" id="today-flash" href="./flashcards.html?mode=due">Flash</a>
        <a class="btn secondary" id="today-fiche" href="./matiere.html">Fiche</a>
      </div>
    </section>

    <div class="stat-grid" id="home-stats" aria-label="Resume" hidden>
      <div class="stat-cell"><b id="home-pct">?</b><span>Reussis</span></div>
      <div class="stat-cell"><b id="home-review">0</b><span>A revoir</span></div>
      <div class="stat-cell"><b id="home-days">0</b><span>Jours</span></div>
    </div>

    <p class="eyebrow">Continuer</p>
    <section class="rubric-panel" aria-label="Continuer">
      <a class="rubric-row" href="./entrainement.html">
        <span class="row-badge">Q</span>
        <span class="row-body"><h2>Entrainement</h2><p id="home-qcm-sub">QCM cibles</p></span>
        <span class="row-chev">?</span>
      </a>
      <a class="rubric-row" id="home-flash-row" href="./flashcards.html?mode=due">
        <span class="row-badge">F</span>
        <span class="row-body"><h2>Flashcards</h2><p id="home-flash-sub">Rien en retard</p></span>
        <span class="row-chev">?</span>
      </a>
      <a class="rubric-row" id="home-weak-row" href="./suivi.html#rework-panel">
        <span class="row-badge">!</span>
        <span class="row-body"><h2>Points faibles</h2><p id="home-weak-sub">Voir le suivi</p></span>
        <span class="row-chev">?</span>
      </a>
    </section>
  </div>

  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
  <script src="./js/shell-tabbar.js?v=2"></script>
  <script src="./js/suivi-store.js?v=5"></script>
  <script src="./js/today-target.js?v=1"></script>
  <script src="./js/flash-srs.js?v=3"></script>
  <script>
    (function () {
      var S = window.PASS_SUIVI;
      var T = window.PASS_TODAY;
      var SRS = window.PASS_FLASH_SRS;
      if (!S || !T) return;

      var card = document.getElementById("today-card");
      var title = document.getElementById("today-title");
      var meta = document.getElementById("today-meta");
      var target = T.getTodayTarget(true);
      if (target && target.ch) {
        var links = T.hrefsFor(target.ch);
        title.textContent = target.ch + " ? " + (S.CHAPTERS[target.ch] || "");
        if (target.reason === "review") {
          meta.textContent = target.level === "red" ? "Priorite faible" : "A consolider";
        } else if (target.reason === "start") {
          meta.textContent = "Premier chapitre";
        } else {
          meta.textContent = "Reprise";
        }
        document.getElementById("today-qcm").href = links.qcm;
        document.getElementById("today-flash").href = links.flash;
        document.getElementById("today-fiche").href = links.fiche;
        card.hidden = false;
      }

      var data = S.getAnatomie() || {};
      var n = 0, ok = 0, daySet = {}, weak = [];
      for (var ci = 0; ci < S.CHAPTER_ORDER.length; ci++) {
        var ch = S.CHAPTER_ORDER[ci];
        var row = data[ch] || {};
        n += row.n || 0;
        ok += row.ok || 0;
        var iso = row.lastQcmAt || row.updatedAt;
        if (iso) {
          var d = new Date(iso);
          if (d.getTime()) {
            daySet[d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")] = true;
          }
        }
        var lastReady = (row.lastN || 0) >= S.MIN_Q;
        var cumulReady = (row.n || 0) >= S.MIN_Q;
        var last = lastReady ? (row.lastLevel || "none") : "none";
        var cumul = cumulReady ? (row.level || "none") : "none";
        var level = "none";
        if (last === "red" || cumul === "red") level = "red";
        else if (last === "blue" || cumul === "blue") level = "blue";
        if (level === "red" || level === "blue") weak.push({ ch: ch, level: level });
      }
      weak.sort(function (a, b) {
        return (a.level === "red" ? 0 : 1) - (b.level === "red" ? 0 : 1) || a.ch.localeCompare(b.ch);
      });

      var streak = 0;
      if (Object.keys(daySet).length) {
        var today = T.todayISO();
        var cursor = new Date(today + "T12:00:00");
        var y = new Date(cursor); y.setDate(y.getDate() - 1);
        var yKey = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
        if (daySet[today] || daySet[yKey]) {
          if (!daySet[today]) cursor = y;
          for (var i = 0; i < 60; i++) {
            var k = cursor.getFullYear() + "-" + String(cursor.getMonth() + 1).padStart(2, "0") + "-" + String(cursor.getDate()).padStart(2, "0");
            if (!daySet[k]) break;
            streak += 1;
            cursor.setDate(cursor.getDate() - 1);
          }
        }
      }

      var flash = (SRS && typeof SRS.chapterStats === "function") ? SRS.chapterStats() : { dueTotal: 0 };
      var due = flash.dueTotal || 0;
      var pct = n ? Math.round((ok / n) * 100) : null;
      var stats = document.getElementById("home-stats");
      if (n > 0 || due > 0 || streak > 0) {
        document.getElementById("home-pct").textContent = pct == null ? "?" : pct + "%";
        document.getElementById("home-review").textContent = String(due);
        document.getElementById("home-days").textContent = String(streak);
        stats.hidden = false;
      }

      var qcmSub = document.getElementById("home-qcm-sub");
      if (qcmSub && target && target.ch) {
        qcmSub.textContent = (target.reason === "review" ? "Priorite" : "Reprise") + " · ch. " + target.ch;
      }
      var flashSub = document.getElementById("home-flash-sub");
      if (flashSub) flashSub.textContent = due ? due + " a revoir aujourd'hui" : "Rien en retard";
      var flashRow = document.getElementById("home-flash-row");
      if (flashRow && due) flashRow.querySelector(".row-badge").classList.add("warn");
      var weakSub = document.getElementById("home-weak-sub");
      var weakRow = document.getElementById("home-weak-row");
      if (weakSub) {
        if (weak.length) {
          weakSub.textContent = weak.slice(0, 2).map(function (w) { return "Ch. " + w.ch; }).join(" · ");
          if (weakRow) weakRow.querySelector(".row-badge").classList.add("warn");
        } else {
          weakSub.textContent = "Rien de critique";
        }
      }
    })();
  </script>
</body>
</html>
