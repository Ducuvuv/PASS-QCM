<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PASS Sorbonne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=m13" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="site-top">
        <a class="brand" href="./index.html">PASS Sorbonne</a>
      </div>
      <nav aria-label="Navigation principale">
        <ul class="nav-chips">
          <li><a href="./index.html" aria-current="page">Accueil</a></li>
          <li><a href="./matiere.html">Matière</a></li>
          <li><a href="./entrainement.html">Entraînement</a></li>
          <li><a href="./flashcards.html">Flashcards</a></li>
          <li><a href="./suivi.html">Suivi</a></li>
          <li><a href="./planning.html">Planning</a></li>
          <li><a href="./competitions.html">Compétitions</a></li>
          <li><a href="./conseils.html">Conseils</a></li>
        </ul>
      </nav>
    </header>

    <section class="continue-card" id="today-card" hidden>
      <p class="continue-kicker" id="today-kicker">Aujourd’hui</p>
      <h2 class="continue-title" id="today-title">—</h2>
      <p class="continue-meta" id="today-meta"></p>
      <div class="continue-actions">
        <a class="btn" id="today-qcm" href="./qcm-player.html">QCM</a>
        <a class="btn secondary" id="today-flash" href="./flashcards.html?mode=due">Flash</a>
        <a class="btn secondary" id="today-fiche" href="./matiere.html">Fiche</a>
      </div>
    </section>

    <section class="rubric-panel" aria-label="Rubriques">
      <a class="rubric-row" href="./matiere.html"><h2>Matière</h2></a>
      <a class="rubric-row" href="./entrainement.html"><h2>Entraînement</h2></a>
      <a class="rubric-row" href="./flashcards.html"><h2>Flashcards</h2></a>
      <a class="rubric-row" href="./suivi.html"><h2>Suivi</h2></a>
      <a class="rubric-row" href="./planning.html"><h2>Planning</h2></a>
      <a class="rubric-row" href="./competitions.html">
        <h2>Compétitions</h2>
        <span class="badge soon">Bientôt</span>
      </a>
      <a class="rubric-row" href="./conseils.html"><h2>Conseils</h2></a>
    </section>
  </div>

  <script src="./js/suivi-store.js?v=5"></script>
  <script src="./js/today-target.js?v=1"></script>
  <script>
    (function () {
      const S = window.PASS_SUIVI;
      const T = window.PASS_TODAY;
      if (!S || !T) return;

      const card = document.getElementById("today-card");
      const kicker = document.getElementById("today-kicker");
      const title = document.getElementById("today-title");
      const meta = document.getElementById("today-meta");
      const aQcm = document.getElementById("today-qcm");
      const aFlash = document.getElementById("today-flash");
      const aFiche = document.getElementById("today-fiche");

      const target = T.getTodayTarget(true);
      if (!target) return;

      const name = S.CHAPTERS[target.ch] || "";
      const links = T.hrefsFor(target.ch);

      kicker.textContent = "Aujourd’hui";
      title.textContent = target.ch + " — " + name;
      if (target.reason === "review") {
        meta.textContent = target.level === "red" ? "Priorité faible" : "À consolider";
      } else if (target.reason === "start") {
        meta.textContent = "Premier chapitre";
      } else {
        meta.textContent = "Reprise";
      }

      aQcm.href = links.qcm;
      aFlash.href = links.flash;
      aFiche.href = links.fiche;
      card.hidden = false;
    })();
  </script>
</body>
</html>
